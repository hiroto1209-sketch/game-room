<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#17111c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>GAME ROOM — Party World</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="3Dパーティーワールド"></canvas>
    <div id="loading" aria-live="polite"><span class="loader"></span><span>WORLD LOADING...</span></div>

    <div id="top-bar">
      <div class="world-label"><span class="live-dot"></span><span>GAME <b>ROOM</b></span><small>PARTY WORLD / 001</small></div>
      <button id="menu-button" class="icon-button" aria-label="メニューを開く">☰</button>
    </div>

    <div id="start-screen" class="screen">
      <div class="start-heading"><span class="overline">WELCOME TO YOUR OWN WORLD</span><span class="start-title">GAME ROOM</span><span class="subheading">THE PARTY STARTS HERE</span></div>
      <button id="start-button" class="start-button">スタート <span aria-hidden="true">→</span></button>
      <p class="start-caption">歩き回れる、あなたのパーティーワールド</p>
    </div>

    <div id="hud" class="hidden">
      <div id="crosshair" aria-hidden="true"></div>
      <div id="tips">左側をスライドで移動 <span>•</span> 右側をスライドで見渡す</div>
      <div id="joystick" aria-hidden="true"><div id="joystick-thumb"></div></div>
      <button id="jump-button" class="round-action" aria-label="ジャンプ"><span>↑</span><small>JUMP</small></button>
      <div id="interaction" class="hidden">
        <div id="interaction-text">LIGHT SHOW</div>
        <button id="interact-button">あそぶ</button>
      </div>
      <div id="toast" role="status"></div>
    </div>

    <div id="menu-overlay" class="screen hidden" role="dialog" aria-modal="true" aria-label="ゲーム設定">
      <div class="menu-card">
        <div class="menu-head"><div><span class="overline">GAME ROOM</span><h2>ポーズ / 設定</h2></div><button id="close-menu" class="icon-button" aria-label="設定を閉じる">×</button></div>
        <label class="setting"><span>視点の感度 <output id="sensitivity-value">4</output></span><input id="sensitivity" type="range" min="1" max="10" step="1" value="4" /></label>
        <label class="setting"><span>画面の明るさ <output id="brightness-value">1.0</output></span><input id="brightness" type="range" min="0.7" max="1.6" step="0.1" value="1.0" /></label>
        <label class="toggle"><span>音楽（シンプルなBGM）</span><input id="sound-enabled" type="checkbox" /></label>
        <label class="toggle"><span>動きを控えめにする</span><input id="reduced-motion" type="checkbox" /></label>
        <button id="resume-button" class="primary-menu-button">ワールドへ戻る</button>
        <button id="return-title" class="plain-menu-button">タイトルに戻る</button>
        <div class="menu-footer">iPhone / iPad / PC 対応 · Phase 1</div>
      </div>
    </div>
    <div id="fatal" class="screen hidden" role="alert"><p>3Dワールドを読み込めませんでした。<br />通信環境とWebGL対応をご確認ください。</p></div>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
