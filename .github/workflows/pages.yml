name: Game Room 2.0 — test, build and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# PR checks run independently; releases remain strictly serialized.
concurrency:
  group: game-room-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: TypeScript · tests · Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Protocol and input tests
        run: npm test
      - name: Production build
        env:
          VITE_GAME_ROOM_SERVER_URL: ${{ vars.GAME_ROOM_SERVER_URL }}
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npm run check:worker
      - name: Two-client local Durable Object smoke
        run: npm run test:realtime
      - name: Install Chromium for visual FPS quality gate
        run: npx playwright install --with-deps chromium
      - name: FPS screen visibility gate (portrait / landscape / PC)
        run: npm run test:visual
      - name: Mobile HUD editor gate (iPhone/iPad save and safety)
        run: npm run test:hud:visual
      - name: Original FPS scene gate (lazy loading / entrance / four mobile layouts)
        run: npm run test:stage:visual
      - name: Archive original FPS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playcanvas-fps-screenshots
          path: artifacts/playcanvas/
          if-no-files-found: ignore
          retention-days: 14
      - name: Forest cleanup and POKO welcome gate (phone portrait / landscape)
        run: npm run test:forest:visual
      - name: Archive forest welcome screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-welcome-screenshots
          path: artifacts/forest-visual/
          if-no-files-found: ignore
          retention-days: 14
      - name: Resident collision and conversation gate (phone portrait / landscape)
        run: npm run test:residents:visual
      - name: Archive resident screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residents-screenshots
          path: artifacts/residents-visual/
          if-no-files-found: ignore
          retention-days: 14
      - name: Hidden world visual gate (cave / secret trail / hilltop)
        run: npm run test:exploration:visual
      - name: Archive exploration screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploration-visual-screenshots
          path: artifacts/exploration-visual/
          if-no-files-found: ignore
          retention-days: 14
      - name: Archive FPS visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fps-visual-screenshots
          path: artifacts/fps-visual/
          if-no-files-found: ignore
          retention-days: 14
      - name: Archive built output
        uses: actions/upload-artifact@v4
        with:
          name: game-room-dist
          path: dist/
          retention-days: 7

  deploy-worker:
    name: Deploy Cloudflare Worker first
    # PRs are checks only: deploy only from the approved main branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm deployment secrets and client endpoint
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAME_ROOM_SERVER_URL: ${{ vars.GAME_ROOM_SERVER_URL }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
            exit 1
          fi
          if [[ "$GAME_ROOM_SERVER_URL" != https://* ]]; then
            echo "::error::Set GAME_ROOM_SERVER_URL to the deployed HTTPS Worker origin in repository Actions variables."
            exit 1
          fi
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy game-room-realtime
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config server/wrangler.jsonc
      - name: Verify deployed Worker health
        env:
          GAME_ROOM_SERVER_URL: ${{ vars.GAME_ROOM_SERVER_URL }}
        run: |
          curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 \
            "${GAME_ROOM_SERVER_URL%/}/api/health" \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const v=JSON.parse(s);if(v.ok!==true||v.service!=="game-room-realtime")process.exit(1)})'

  deploy:
    name: Deploy GitHub Pages after Worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, deploy-worker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-room-dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
