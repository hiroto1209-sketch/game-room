<!DOCTYPE html>
<html lang="ja">
<head>

  <link rel="apple-touch-icon" href="icon.png">

  <meta name="twitter:title" content="1万缶つみ射的">

  <meta name="theme-color" content="#140816">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; height: 100dvh; overflow: hidden;
      background: #140816; color: #fff8ea;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Yu Gothic", "WenQuanYi Micro Hei", "Droid Sans Fallback", "Hiragino Sans", Meiryo, system-ui, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; touch-action: none; }
    button, a { touch-action: manipulation; font: inherit; }
    a { color: inherit; text-decoration: none; }
    #top {
      position: fixed; z-index: 6;
      top: calc(8px + env(safe-area-inset-top));
      left: calc(8px + env(safe-area-inset-left));
      right: calc(8px + env(safe-area-inset-right));
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
      pointer-events: none;
    }
    #top button, #top a { pointer-events: auto; }
    .cluster { display: flex; flex-wrap: wrap; gap: 6px; max-width: 62%; }
    .pill {
      min-width: 44px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 999px;
      background: #2a1424; color: #fff8ea; font-weight: 800;
      box-shadow: inset 0 0 0 1px rgb(255 214 140 / 0.45);
      display: inline-flex; align-items: center; justify-content: center;
    }
    #stats {
      pointer-events: none; text-align: right; line-height: 1.2;
      background: #2a1424; color: #fff8ea; border-radius: 16px; padding: 8px 12px;
      box-shadow: inset 0 0 0 1px rgb(255 214 140 / 0.45);
    }
    #stats b { display: block; font-size: 1rem; }
    #stats span { display: block; font-size: 0.78rem; font-weight: 700; opacity: 0.92; }
    #chainLabel { color: #ffe08a; font-size: 0.95rem !important; }
    #hint {
      position: fixed; z-index: 4; left: 12px; right: 12px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      text-align: center; font-weight: 800; pointer-events: none;
      font-size: clamp(0.95rem, 3.6vw, 1.2rem);
      text-shadow: 0 2px 0 #3a1020;
    }
    #gauge {
      position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
      bottom: calc(52px + env(safe-area-inset-bottom));
      width: min(280px, 70vw); height: 18px; border-radius: 999px;
      background: linear-gradient(90deg, #8a4a3a 0 68%, #ffe36a 68% 86%, #3ecf7a 86%);
      box-shadow: inset 0 0 0 2px #fff6e0;
    }
    #gauge[hidden] { display: none; }
    #sweet {
      position: absolute; left: 68%; top: -3px; bottom: -3px; width: 32%;
      border-radius: 999px; box-shadow: inset 0 0 0 2px #fffaf0;
      pointer-events: none;
    }
    #knob {
      position: absolute; top: -5px; width: 14px; height: 28px; margin-left: -7px;
      border-radius: 6px; background: #fffaf0; box-shadow: 0 2px 0 #5a3018;
    }
    #floater {
      position: fixed; z-index: 4; left: 50%; top: 22%;
      transform: translateX(-50%); font-weight: 900; font-size: 1.6rem; color: #ffe08a;
      text-shadow: 0 2px 0 #5a1020, 0 0 12px #5a1020; pointer-events: none; opacity: 0;
    }
    #tut {
      position: fixed; z-index: 7; inset: 0; display: grid; place-items: end center;
      padding: calc(12px + env(safe-area-inset-bottom)) 16px 18vh;
      background: linear-gradient(transparent, rgb(12 4 16 / 0.28) 40%, rgb(12 4 16 / 0.45));
    }
    #tut[hidden] { display: none; }
    #tut .row { display: flex; gap: 10px; }
    #tut .step {
      width: 96px; min-height: 96px; border-radius: 20px; background: #fff6e8; color: #3a1822;
      display: grid; place-items: center; text-align: center; font-weight: 900; line-height: 1.15;
      box-shadow: 0 10px 24px rgb(0 0 0 / 0.28);
    }
    #tut .step b { font-size: 1.6rem; color: #c5283d; }
    #tut .step span { font-size: 0.78rem; }
    #result {
      position: fixed; z-index: 5; inset: 0; display: grid; place-items: center;
      background: rgb(8 2 12 / 0.42);
      padding: calc(64px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    }
    #result[hidden] { display: none; }
    #card {
      width: min(420px, 100%); max-height: 100%; overflow: auto; text-align: center;
      background: #fff6e8; color: #3a1822; border-radius: 24px; padding: 18px 16px 14px;
    }
    #stars { margin: 4px 0; font-size: 2rem; letter-spacing: 0.12em; color: #e0a020; }
    #big { font-size: clamp(3rem, 12vw, 4.4rem); font-weight: 900; line-height: 0.95; color: #c5283d; }
    #prize { font-size: 1.3rem; font-weight: 900; margin: 6px 0; }
    #bestline, #goalLine { margin: 0 0 8px; font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .actions button { min-height: 46px; padding: 0 14px; border: 0; border-radius: 999px; background: #3a1822; color: #fff6e8; font-weight: 800; }
    .actions button.ghost { background: transparent; color: #3a1822; box-shadow: inset 0 0 0 2px #3a1822; }
    @media (orientation: landscape) {
      #tut { place-items: center; padding-bottom: 12px; }
      #hint { bottom: calc(10px + env(safe-area-inset-bottom)); }
      #gauge { bottom: calc(40px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header id="top">
    <div class="cluster">
      <a class="pill" id="back" href="../../">一覧</a>
      <button class="pill" id="lang" type="button">EN</button>
      <button class="pill" id="sound" type="button" aria-pressed="true">音</button>
      <button class="pill" id="retry" type="button">やり直し</button>
    </div>
    <div id="stats">
      <b id="stageLabel">第1面</b>
      <span id="shotLabel">残り 3</span>
      <span id="goalLabel">目標 8</span>
      <span id="chainLabel" hidden>連鎖 ×2</span>
    </div>
  </header>
  <div id="floater"></div>
  <p id="hint">横にドラッグ</p>
  <div id="gauge" hidden><i id="sweet"></i><i id="knob"></i></div>
  <div id="tut" hidden>
    <div class="row">
      <div class="step"><b>1</b><span id="tut1">横にずらす</span></div>
      <div class="step"><b>2</b><span id="tut2">高さを止める</span></div>
      <div class="step"><b>3</b><span id="tut3">強さを止める</span></div>
    </div>
  </div>
  <div id="result" hidden>
    <div id="card">
      <div id="resultStage">第1面</div>
      <div id="stars">☆☆☆</div>
      <div id="stamp" hidden>全部落とし</div>
      <div id="big">0</div>
      <p id="goalLine">目標 8</p>
      <p id="prize">景品：飴</p>
      <p id="bestline"></p>
      <div class="actions">
        <button id="again" type="button">もう一回</button>
        <button id="next" type="button">次の面</button>
        <button id="share" type="button">共有</button>
        <button id="post" class="ghost" type="button">Xにポスト</button>
      </div>
    </div>
  </div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";

    const W0 = 24;
    const D0 = 41;
    const N = 10000;
    const MAX = N;
    const MAX_CORKS = 240;
    const STEP = 1 / 90;
    const GRAV = 12;
    const LANG_KEY = "cans-gallery:v2:lang";
    const TUT_KEY = "cans-gallery:v2:tut";
    const PALETTE = [0x2f6fce, 0x2e9e62, 0xf4f0e6, 0x5c6d92, 0xd07a3a];
    const AIM_SPEED = 13.2;
    const SWEET = 0.68;

    const TEXT = {
      ja: {
        title: "1万缶つみ射的", back: "一覧", lang: "EN", soundOn: "音", soundOff: "消", retry: "やり直し",
        place: "横にドラッグ", aim: "タップで高さを止める", power: "白枠で強さを止める", fly: "",
        stage: (n) => "第" + n + "面", shots: (n) => "残り " + n, goal: (n) => "目標 " + n,
        down: (n) => "倒した " + n, chain: (n) => "連鎖 ×" + n, gold: "黄金!", key: "要石!",
        tut1: "横にずらす", tut2: "高さを止める", tut3: "強さを止める",
        again: "もう一回", next: "次の面", share: "共有", post: "Xにポスト",
        candy: "景品：飴", toy: "景品：おもちゃ", grand: "景品：特賞", none: "残念",
        all: "全部落とし", best: (n) => "ベスト " + n, newBest: "ベスト更新",
        shareLine: (stage, stars, knocked) => "1万缶つみ射的 " + stage + " " + stars + " " + knocked + "缶"
      },
      en: {
        title: "10,000 Can Gallery", back: "Games", lang: "日本語", soundOn: "Snd", soundOff: "Off", retry: "Retry",
        place: "Drag sideways", aim: "Tap to set height", power: "Stop inside the bracket", fly: "",
        stage: (n) => "Stage " + n, shots: (n) => n + " left", goal: (n) => "Goal " + n,
        down: (n) => "Down " + n, chain: (n) => "Chain ×" + n, gold: "GOLD!", key: "KEY!",
        tut1: "Slide", tut2: "Stop height", tut3: "Stop power",
        again: "Again", next: "Next", share: "Share", post: "Post",
        candy: "Prize: candy", toy: "Prize: toy", grand: "Prize: grand", none: "Miss",
        all: "ALL DOWN", best: (n) => "Best " + n, newBest: "New best",
        shareLine: (stage, stars, knocked) => "10,000 Can Gallery " + stage + " " + stars + " " + knocked + " cans"
      }
    };

    const $ = (id) => document.getElementById(id);
    let lang = "ja";
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "ja") lang = saved;
    } catch (e) {}
    let muted = false;
    let seenTut = false;
    try { seenTut = localStorage.getItem(TUT_KEY) === "1"; } catch (e) {}

    const ox = new Float32Array(MAX), oy = new Float32Array(MAX), oz = new Float32Array(MAX);
    const px = new Float32Array(MAX), py = new Float32Array(MAX), pz = new Float32Array(MAX);
    const vx = new Float32Array(MAX), vy = new Float32Array(MAX), vz = new Float32Array(MAX);
    const rx = new Float32Array(MAX), ry = new Float32Array(MAX), rz = new Float32Array(MAX);
    const svx = new Float32Array(MAX), svy = new Float32Array(MAX), svz = new Float32Array(MAX);
    const state = new Uint8Array(MAX);
    const support = new Uint8Array(MAX);
    const initSupport = new Uint8Array(MAX);
    const depN = new Uint8Array(MAX);
    const deps = new Int32Array(MAX * 4);
    const gold = new Uint8Array(MAX);
    const keystone = new Uint8Array(MAX);
    const colors = new Float32Array(MAX * 3);
    const info = new Float32Array(MAX * 2);
    const hide = new Float32Array(MAX);

    const STAGES = [
      { id: 1, kind: "tri", rows: 7, h: 0.34, pitch: 0.42, star: [6, 11, 16], gates: [[-1, 0], [1, 0]], move: [] },
      { id: 2, kind: "tri", rows: 10, h: 0.3, pitch: 0.36, star: [8, 22, 36], gates: [[-1, 0], [1, 0], [0, 1]], move: [2] },
      { id: 3, kind: "pyr", base: 6, h: 0.28, pitch: 0.34, star: [12, 22, 32], gates: [[-1, 0], [1, 0], [0, 1]], move: [2] },
      { id: 4, kind: "pyr", base: 9, h: 0.26, pitch: 0.3, star: [36, 70, 120], gates: [[-1, 0], [1, 0], [-0.2, 1], [0.2, 1]], move: [2, 3] },
      { id: 5, kind: "mass", h: 0.22, pitch: 0.2, star: [450, 900, 1300], gates: [[-1, 0], [1, 0], [-0.2, 1], [0.2, 1]], move: [2, 3] }
    ];

    let stageIndex = 0;
    let count = 0;
    let peakY = 1;
    let canR = 0.12;
    let canH = 0.3;
    let gunX = 0;
    const gunY = 0.14;
    const gunZ = -1.85;
    let aimPitch = 0.08;
    let power = 0.2;
    let lockedId = -1;
    let pitchHeld = false;
    let pitchLo = 0.04;
    let pitchHi = 1.05;
    let phase = "place";
    let shotsLeft = 3;
    let knocked = 0;
    let chain = 0;
    let bestChain = 0;
    let lastChainAt = -10;
    let simTime = 0;
    let shotWall = 0;
    let slowUntil = 0;
    let shake = 0;
    let kick = 0;
    let impacted = false;
    let aimId = -1;
    let dragging = false;
    let dragX = 0;
    let audioCtx = null;
    let sfxBudget = 0;
    const live = [];
    const keys = [];
    const golds = [];
    let gates = [];
    let simple = true;

    const bx = new Float32Array(MAX_CORKS), by = new Float32Array(MAX_CORKS), bz = new Float32Array(MAX_CORKS);
    const cvx = new Float32Array(MAX_CORKS), cvy = new Float32Array(MAX_CORKS), cvz = new Float32Array(MAX_CORKS);
    const cmask = new Uint16Array(MAX_CORKS), cskip = new Uint8Array(MAX_CORKS), calive = new Uint8Array(MAX_CORKS);
    const cpunch = new Float32Array(MAX_CORKS);
    const wakeAt = new Float32Array(MAX);
    const body = new Uint8Array(MAX);
    const markers = [];
    const faceList = [];
    let faceStamp = -1;
    const freeCorks = [];
    let aliveN = 0;
    let cellStart, items, GX, GZ, minX, minZ, CELL;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x140816, 1);
    document.body.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x140816);
    const camera = new THREE.PerspectiveCamera(42, 1, 0.08, 80);
    scene.add(new THREE.HemisphereLight(0xfff1dc, 0x2a1830, 1));
    const sun = new THREE.DirectionalLight(0xfff4e4, 1.35);
    sun.position.set(1.5, 7, -5);
    scene.add(sun);
    const level = new THREE.Group();
    scene.add(level);

    function canTexture() {
      const c = document.createElement("canvas");
      c.width = 64; c.height = 64;
      const g = c.getContext("2d");
      g.fillStyle = "#fff";
      g.fillRect(0, 0, 64, 64);
      g.fillStyle = "#241018";
      g.fillRect(0, 0, 64, 8);
      g.fillRect(0, 56, 64, 8);
      g.fillStyle = "#ffffff";
      g.fillRect(6, 26, 52, 12);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const canMat = new THREE.MeshLambertMaterial({ map: canTexture() });
    let canGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.3, 10);
    let canMesh = new THREE.InstancedMesh(canGeo, canMat, 16);
    let pointMesh = null;
    let infoAttr = null;
    let hideAttr = null;
    const corkMat = new THREE.MeshLambertMaterial({ color: 0xf2c48a });
    const corkGeo = new THREE.CylinderGeometry(0.07, 0.075, 0.16, 10);
    const corkMesh = new THREE.InstancedMesh(corkGeo, corkMat, MAX_CORKS);
    corkMesh.frustumCulled = false;
    corkMesh.count = 0;
    scene.add(corkMesh);
    const trailGeo = new THREE.SphereGeometry(0.05, 8, 6);
    const trailMat = new THREE.MeshBasicMaterial({ color: 0xfff3bf, depthTest: false });
    const trail = new THREE.InstancedMesh(trailGeo, trailMat, 28);
    trail.frustumCulled = false;
    trail.count = 0;
    scene.add(trail);
    const reticle = new THREE.Mesh(
      new THREE.TorusGeometry(0.22, 0.03, 8, 28),
      new THREE.MeshBasicMaterial({ color: 0xfff6c8, depthTest: false })
    );
    reticle.renderOrder = 6;
    scene.add(reticle);
    const gun = new THREE.Group();
    const stock = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.16, 0.46), new THREE.MeshLambertMaterial({ color: 0x6a4326 }));
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.62, 8), new THREE.MeshLambertMaterial({ color: 0x8e939b }));
    barrel.rotation.x = Math.PI / 2;
    barrel.position.z = 0.42;
    gun.add(stock, barrel);
    scene.add(gun);
    const dummy = new THREE.Object3D();
    const tmpColor = new THREE.Color();
    const aimPoints = [];
    const up = new THREE.Vector3(0, 1, 0);
    const camLook = new THREE.Vector3();

    function t() { return TEXT[lang]; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function wave(ms, period) {
      const f = ((ms / 1000) % period) / period;
      return f < 0.5 ? f * 2 : 2 - f * 2;
    }
    function bestKey() { return "cans-gallery:v2:best:" + STAGES[stageIndex].id; }
    function readBest() {
      try { return Math.max(0, Number(localStorage.getItem(bestKey())) || 0); } catch (e) { return 0; }
    }
    function stageDef() { return STAGES[stageIndex]; }
    function muzzle() { return { x: gunX, y: gunY + 0.1, z: gunZ + 0.55 }; }
    function shotPunch() {
      if (power >= SWEET) return 0.94 + (power - SWEET) / (1 - SWEET) * 0.28;
      if (power >= 0.4) return 0.62;
      return 0.4;
    }
    function heightAtPitch(pitch) {
      const m = muzzle();
      let y = m.y;
      let z = m.z;
      let vy = Math.sin(pitch) * AIM_SPEED;
      const vz = Math.cos(pitch) * AIM_SPEED;
      let guard = 0;
      while (guard++ < 80 && z < 0.02 && y > -0.5) {
        vy -= GRAV * 0.035;
        y += vy * 0.035;
        z += vz * 0.035;
      }
      return y;
    }
    function pitchForY(target) {
      let lo = -0.1, hi = 1.25;
      for (let i = 0; i < 12; i++) {
        const mid = (lo + hi) * 0.5;
        if (heightAtPitch(mid) < target) lo = mid;
        else hi = mid;
      }
      return (lo + hi) * 0.5;
    }
    function calibrateAim() {
      pitchLo = pitchForY(canH * 0.5);
      pitchHi = pitchForY(Math.min(peakY, 2.65));
      if (pitchHi < pitchLo + 0.2) pitchHi = pitchLo + 0.2;
    }
    function previewVelocity() {
      return { vx: 0, vy: Math.sin(aimPitch) * AIM_SPEED, vz: Math.cos(aimPitch) * AIM_SPEED };
    }
    function velocityTo(tx, ty, tz) {
      const m = muzzle();
      const dx = tx - m.x, dy = ty - m.y, dz = tz - m.z;
      const dist = Math.hypot(dx, dy, dz);
      const flight = clamp(dist / 7.4, 0.28, 0.48);
      return { vx: dx / flight, vy: dy / flight + 0.5 * GRAV * flight, vz: dz / flight };
    }

    function applyLang() {
      const s = t();
      document.documentElement.lang = lang;
      document.title = s.title;
      $("back").textContent = s.back;
      $("lang").textContent = s.lang;
      $("sound").textContent = muted ? s.soundOff : s.soundOn;
      $("retry").textContent = s.retry;
      $("tut1").textContent = s.tut1;
      $("tut2").textContent = s.tut2;
      $("tut3").textContent = s.tut3;
      $("again").textContent = s.again;
      $("next").textContent = s.next;
      $("share").textContent = s.share;
      $("post").textContent = s.post;
      $("stamp").textContent = s.all;
      const hint = { place: s.place, aim: s.aim, power: s.power, fly: s.fly, result: "" };
      $("hint").textContent = hint[phase] || "";
      $("stageLabel").textContent = s.stage(stageDef().id);
      $("shotLabel").textContent = phase === "fly" || phase === "result" ? s.down(knocked) : s.shots(shotsLeft);
      $("goalLabel").textContent = s.goal(stageDef().star[0]);
      $("chainLabel").hidden = chain < 2;
      $("chainLabel").textContent = s.chain(chain);
      $("gauge").hidden = phase !== "power";
      if (phase === "power") $("knob").style.left = (power * 100) + "%";
    }

    function ensureAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, dur, type, gain) {
      const ac = audioCtx;
      if (!ac || muted) return;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(gain, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + dur);
    }
    function playPop() { tone(210, 0.06, "sine", 0.14); }
    function playClang(combo) {

    function link(parent, child) {

    function buildTriangle(rows, H, P) {

    function buildPyramid(base, H, P) {

    function buildMass(H, P) {

    function buildGrid() {

    function spawnCork(x, y, z, svx, svy, svz, mask, punch) {
      if (!freeCorks.length || aliveN >= MAX_CORKS) return -1;
      const i = freeCorks.pop();
      calive[i] = 1; cskip[i] = 1; cmask[i] = mask || 0;
      cpunch[i] = punch == null ? 0.6 : punch;
      bx[i] = x; by[i] = y; bz[i] = z; cvx[i] = svx; cvy[i] = svy; cvz[i] = svz;
      aliveN++;
      return i;
    }
    function killCork(i) {
      if (!calive[i]) return;
      calive[i] = 0; aliveN--; freeCorks.push(i);
    }
    function passGate(i, gate) {
      if (gate.kind === "+" && gate.used) return;
      const extra = gate.kind === "x" ? gate.n - 1 : gate.n;
      if (gate.kind === "+") gate.used = true;
      for (let k = 0; k < extra; k++) {
        spawnCork(
          bx[i] + (Math.random() - 0.5) * 0.12, by[i], gate.z + 0.06,
          cvx[i] + (Math.random() - 0.5) * 1.4, cvy[i] + (Math.random() - 0.5) * 0.8, cvz[i] * 0.96,
          cmask[i] | (1 << gate.bit), cpunch[i] * 0.62
        );
      }
      playPop();
      $("floater").textContent = (gate.kind === "x" ? "×" : "+") + gate.n;
      $("floater").style.opacity = "1";
    }
    function tryGates(i, z0, z1) {
      for (const gate of gates) {
        if ((cmask[i] & (1 << gate.bit)) !== 0) continue;
        if (!(z0 < gate.z && z1 >= gate.z)) continue;
        cmask[i] |= 1 << gate.bit;
        if (Math.abs(bx[i] - gate.xNow) > gate.w * 0.5) continue;
        if (by[i] < 0.12 || by[i] > 0.52) continue;
        passGate(i, gate);
      }
    }
    function stepCork(i, dt) {
      const speed = Math.hypot(cvx[i], cvy[i], cvz[i]);
      const sub = Math.max(1, Math.ceil((speed * dt) / 0.14));
      const h = dt / sub;
      for (let s = 0; s < sub; s++) {
        if (!calive[i]) return;
        const z0 = bz[i];
        cvy[i] -= GRAV * h;
        bx[i] += cvx[i] * h; by[i] += cvy[i] * h; bz[i] += cvz[i] * h;
        tryGates(i, z0, bz[i]);
        if (hitAt(bx[i], by[i], bz[i], cpunch[i])) {
          killCork(i);
          return;
        }
        if (by[i] < 0.04) {
          by[i] = 0.04; cvy[i] = Math.abs(cvy[i]) * 0.35; cvz[i] *= 0.72;
          playThud();
          if (bz[i] > 0.45 && cvz[i] < 2) { killCork(i); return; }
        }
        if (bz[i] > 8 || Math.abs(bx[i]) > 5) { killCork(i); return; }
      }
    }
    function integrateCans(dt) {
      for (let k = live.length - 1; k >= 0; k--) {
        const i = live[k];
        if (simTime < wakeAt[i]) continue;
        vy[i] -= GRAV * dt;
        px[i] += vx[i] * dt; py[i] += vy[i] * dt; pz[i] += vz[i] * dt;
        rx[i] += svx[i] * dt; ry[i] += svy[i] * dt; rz[i] += svz[i] * dt;
        if (py[i] < canR) {
          py[i] = canR;
          if (vy[i] < 0) vy[i] = -vy[i] * 0.5;
          vx[i] *= 0.78; vz[i] *= 0.72;
          svx[i] *= 0.8; svz[i] *= 0.8;
          if (Math.abs(vy[i]) > 0.8) playThud();
          if (Math.abs(vy[i]) < 0.45 && Math.hypot(vx[i], vz[i]) < 0.35) {
            state[i] = 2;
            body[i] = 0;
            live.splice(k, 1);
          }
        }
      }
    }
    function step(dt) {
      simTime += dt;
      for (let i = 0; i < MAX_CORKS; i++) {
        if (!calive[i] || cskip[i]) continue;
        stepCork(i, dt);
      }
      cskip.fill(0);
      integrateCans(dt);
    }

    function predict() {
      aimPoints.length = 0;
      const m = muzzle();
      let x = m.x, y = m.y, z = m.z;
      let vx, vy, vz;
      const tracking = phase === "power" && lockedId >= 0 && state[lockedId] === 0;
      if (tracking) {
        const v = velocityTo(ox[lockedId], oy[lockedId], oz[lockedId] - canR * 0.25);
        vx = v.vx; vy = v.vy; vz = v.vz;
        aimId = lockedId;
      } else {
        const v = previewVelocity();
        vx = v.vx; vy = v.vy; vz = v.vz;
        aimId = -1;
      }
      const column = Math.max(canR * 1.15, stageDef().pitch * 0.55);
      let guard = 0;
      let hitX = x, hitY = y, crossed = false;
      while (guard++ < 72 && y > -0.25 && z < 3.4) {
        vy -= GRAV * 0.035;
        x += vx * 0.035; y += vy * 0.035; z += vz * 0.035;
        aimPoints.push(x, y, z);
        if (!crossed && z >= 0.02) { hitX = x; hitY = y; crossed = true; if (!tracking) break; }
        if (tracking && z >= oz[lockedId] - canR) break;
      }
      if (!tracking && crossed) {
        let best = 1e9;
        let pick = -1;
        x = hitX; y = hitY;
        forNear(x, 0.02, (id) => {
          if (state[id] !== 0 || oz[id] > 0.28) return;
          const dx = x - ox[id];
          const dy = y - oy[id];
          if (Math.abs(dx) > column) return;
          const d2 = dx * dx + dy * dy;
          if (d2 < best) { best = d2; pick = id; }
        });
        if (pick >= 0 && best < column * column + canH * canH * 0.36) {
          aimId = pick;
          aimPoints.push(ox[pick], oy[pick], oz[pick] - canR);
        }
      }
    }

    function showResult() {
      phase = "result";
      const spec = stageDef();
      const starN = knocked >= spec.star[2] ? 3 : knocked >= spec.star[1] ? 2 : knocked >= spec.star[0] ? 1 : 0;
      const all = spec.kind === "mass" && knocked >= N;
      const fresh = knocked > readBest();
      if (fresh) { try { localStorage.setItem(bestKey(), String(knocked)); } catch (e) {} }
      $("result").hidden = false;
      $("stars").textContent = "★★★".slice(0, starN) + "☆☆☆".slice(0, 3 - starN);
      $("stars").style.color = starN ? "#e0a020" : "#b9a89a";
      $("stamp").hidden = !all;
      $("resultStage").textContent = t().stage(spec.id);
      $("goalLine").textContent = t().goal(spec.star[0]) + " / " + t().down(knocked);
      const prize = all ? "grand" : starN >= 3 ? "grand" : starN === 2 ? "toy" : starN === 1 ? "candy" : "none";
      $("prize").textContent = t()[prize];
      $("bestline").textContent = fresh ? t().newBest : t().best(readBest());
      $("next").hidden = !(starN >= 1 && stageIndex < STAGES.length - 1);
      applyLang();
      $("bestline").textContent = fresh ? t().newBest : t().best(readBest());
      const target = knocked;
      const t0 = performance.now();
      const tick = (now) => {
        if (phase !== "result") return;
        const u = Math.min(1, (now - t0) / 700);
        $("big").textContent = Math.round(target * (1 - (1 - u) ** 3)).toLocaleString("ja-JP");
        if (u < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
    function endShot() {
      const spec = stageDef();
      if (shotsLeft <= 0 || knocked >= count) showResult();
      else { phase = "place"; impacted = false; applyLang(); }
    }
    function fire() {
      phase = "fly";
      shotsLeft--;
      impacted = false;
      shotWall = 0;
      chain = 0;
      kick = 1.2;
      const punch = shotPunch();
      const m = muzzle();
      let vx, vy, vz;
      if (lockedId >= 0 && state[lockedId] === 0) {
        const v = velocityTo(ox[lockedId], oy[lockedId], oz[lockedId] - canR * 0.2);
        vx = v.vx; vy = v.vy; vz = v.vz;
        aimId = lockedId;
      } else {
        const v = previewVelocity();
        vx = v.vx; vy = v.vy; vz = v.vz;
      }
      aimPitch = Math.atan2(vy, Math.max(0.25, vz));
      spawnCork(m.x, m.y, m.z, vx, vy, vz, 0, punch);
      playPop();
      shake = 0.04;
      applyLang();
    }
    function enterAim() {
      phase = "aim";
      lockedId = -1;
      applyLang();
    }
    function enterPower() {
      predict();
      lockedId = aimId;
      if (lockedId >= 0) {
        const m = muzzle();
        aimPitch = Math.atan2(oy[lockedId] - m.y, Math.max(0.25, oz[lockedId] - m.z));
      }
      phase = "power";
      applyLang();
    }

    function starCount() {
      const spec = stageDef();
      return knocked >= spec.star[2] ? 3 : knocked >= spec.star[1] ? 2 : knocked >= spec.star[0] ? 1 : 0;
    }
    function shareText() {
      const stars = "★★★".slice(0, starCount()) + "☆☆☆".slice(0, 3 - starCount());
      const url = location.href.split("#")[0];
      return t().shareLine(t().stage(stageDef().id), stars, knocked) + "\n" + url + "\n#1万缶つみ射的";
    }
    function resultImage() {
      renderer.render(scene, camera);
      const w = 720, h = 900;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const g = c.getContext("2d");
      const src = renderer.domElement;
      const scale = Math.max(w / src.width, h / src.height);
      g.drawImage(src, (w - src.width * scale) / 2, (h - src.height * scale) / 2, src.width * scale, src.height * scale);
      g.fillStyle = "rgba(20,8,22,0.62)";
      g.fillRect(0, h * 0.62, w, h * 0.38);
      g.fillStyle = "#fff6e8";
      g.textAlign = "center";
      g.font = "700 36px sans-serif";
      g.fillText(t().stage(stageDef().id), w / 2, h * 0.72);
      g.font = "900 84px sans-serif";
      g.fillStyle = "#ffd0a8";
      g.fillText(String(knocked), w / 2, h * 0.84);
      g.font = "700 32px sans-serif";
      g.fillText($("prize").textContent, w / 2, h * 0.92);
      return new Promise((resolve) => c.toBlob(resolve, "image/png"));
    }
    async function shareResult() {
      const text = shareText();
      const url = location.href.split("#")[0];
      try {
        const blob = await resultImage();
        const file = new File([blob], "cans.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], text, url });
          return;
        }
      } catch (e) { if (e && e.name === "AbortError") return; }
      try { if (navigator.share) { await navigator.share({ text, url }); return; } }
      catch (e) { if (e && e.name === "AbortError") return; }
      try { await navigator.clipboard.writeText(text); } catch (e) {}
    }

    function drawCans() {
      const showAim = phase === "aim" || phase === "power" || phase === "place";
      if (simple) {
        for (let i = 0; i < count; i++) {
          const down = state[i] !== 0;
          dummy.position.set(down ? px[i] : ox[i], down ? py[i] : oy[i], down ? pz[i] : oz[i]);
          dummy.rotation.set(down ? rx[i] : 0, down ? ry[i] : 0, down ? rz[i] : 0);
          const s = gold[i] ? 1.06 : 1;
          dummy.scale.set(s, s, s);
          dummy.updateMatrix();
          canMesh.setMatrixAt(i, dummy.matrix);
          const hot = i === aimId && showAim;
          tmpColor.setRGB(colors[i * 3], colors[i * 3 + 1], colors[i * 3 + 2]);
          if (hot) tmpColor.lerp(new THREE.Color(0xffffff), 0.55);
          if (state[i] !== 0) tmpColor.multiplyScalar(0.85);
          canMesh.setColorAt(i, tmpColor);
        }
        canMesh.count = count;
        canMesh.instanceMatrix.needsUpdate = true;
        if (canMesh.instanceColor) canMesh.instanceColor.needsUpdate = true;
        return;
      }
      hide.fill(0);
      if (faceStamp !== knocked) {
        const scored = [];
        for (let i = 0; i < count; i++) {
          if (state[i] === 2) continue;
          if (state[i] === 1 && !body[i]) continue;
          const score = (state[i] === 1 && body[i] ? -2 : 0) + oz[i] * 3 + Math.abs(ox[i]) * 0.22 + oy[i] * 0.06;
          scored.push(i, score);
        }
        const order = [];
        for (let k = 0; k < scored.length; k += 2) order.push(k);
        order.sort((a, b) => scored[a + 1] - scored[b + 1]);
        faceList.length = 0;
        for (let k = 0; k < order.length && faceList.length < 420; k++) faceList.push(scored[order[k]]);
        faceStamp = knocked;
      }
      let n = 0;
      for (let k = 0; k < faceList.length; k++) {
        const i = faceList[k];
        if (state[i] === 1 && !body[i]) continue;
        const down = state[i] !== 0;
        dummy.position.set(down ? px[i] : ox[i], down ? py[i] : oy[i], down ? pz[i] : oz[i]);
        dummy.rotation.set(down ? rx[i] : 0, down ? ry[i] : 0, down ? rz[i] : 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        canMesh.setMatrixAt(n, dummy.matrix);
        tmpColor.setRGB(colors[i * 3], colors[i * 3 + 1], colors[i * 3 + 2]);
        if (i === aimId && showAim) tmpColor.lerp(new THREE.Color(0xffffff), 0.45);
        canMesh.setColorAt(n, tmpColor);
        hide[i] = 1;
        n++;
      }
      canMesh.count = n;
      canMesh.instanceMatrix.needsUpdate = true;
      if (canMesh.instanceColor) canMesh.instanceColor.needsUpdate = true;
      if (hideAttr) {
        hideAttr.clearUpdateRanges();
        hideAttr.needsUpdate = true;
      }
      if (pointMesh) pointMesh.material.uniforms.uTime.value = simTime;
    }
    function drawCorks() {
      let n = 0;
      for (let i = 0; i < MAX_CORKS; i++) {
        if (!calive[i]) continue;
        dummy.position.set(bx[i], by[i], bz[i]);
        dummy.rotation.set(Math.PI / 2, simTime * 6, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        corkMesh.setMatrixAt(n++, dummy.matrix);
      }
      corkMesh.count = n;
      corkMesh.instanceMatrix.needsUpdate = true;
      const dots = Math.min(24, Math.floor(aimPoints.length / 3));
      for (let i = 0; i < dots; i++) {
        const k = Math.floor(i * (aimPoints.length / 3) / dots);
        dummy.position.set(aimPoints[k * 3], aimPoints[k * 3 + 1], aimPoints[k * 3 + 2]);
        const end = i === dots - 1 ? 1.7 : 1;
        dummy.scale.set(end, end, end);
        dummy.updateMatrix();
        trail.setMatrixAt(i, dummy.matrix);
      }
      trail.count = (phase === "aim" || phase === "power" || phase === "place") ? dots : 0;
      trail.instanceMatrix.needsUpdate = true;
    }
    function updateReticle() {
      const show = phase === "aim" || phase === "power" || phase === "place";
      reticle.visible = show && aimId >= 0 && state[aimId] === 0;
      if (!reticle.visible) return;
      reticle.position.set(ox[aimId], oy[aimId], oz[aimId] - canR - 0.06);
      reticle.scale.setScalar(Math.max(0.85, canR / 0.13));
      const hex = keystone[aimId] ? 0xff4050 : gold[aimId] ? 0xffd76a : 0xfff6c8;
      reticle.material.color.setHex(hex);
      reticle.lookAt(camera.position);
    }
    function updateMarkers(now) {
      const s = 1 + Math.sin(now * 0.007) * 0.08;
      for (const mesh of markers) {
        const id = mesh.userData.can;
        const up = state[id] === 0;
        mesh.visible = up;
        if (!up) continue;
        mesh.scale.setScalar(s);
        mesh.position.set(ox[id], oy[id], oz[id] - canR - 0.03);
      }
    }
    function updateCamera(dt) {
      const tall = peakY > 3;
      const frameH = Math.min(peakY, tall ? 2.15 : 2.55);
      const dist = tall ? 2.85 : clamp(2.75 + frameH * 0.28, 3.05, 4.15);
      const lookY = tall ? 0.78 : clamp(frameH * 0.46, 0.7, 1.35);
      const tx = gunX * 0.05;
      const ty = lookY + 0.42;
      const tz = gunZ - dist * 0.78;
      const k = 1 - Math.pow(0.0015, dt);
      camera.position.x += (tx - camera.position.x) * k;
      camera.position.y += (ty - camera.position.y) * k;
      camera.position.z += (tz - camera.position.z) * k;
      if (shake > 0.001) {
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake * 0.5;
        shake *= Math.pow(0.02, dt);
      }
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);
      const span = frameH * (aspect > 1.15 ? 0.7 : 0.96) + 0.62;
      const camDist = Math.max(0.8, dist * 0.78);
      camera.fov = clamp(THREE.MathUtils.radToDeg(2 * Math.atan(span / (2 * camDist))), 30, 48);
      camera.aspect = aspect;
      camera.updateProjectionMatrix();
      camLook.set(gunX * 0.03, lookY, 0.02);
      camera.lookAt(camLook);
      gun.position.set(gunX, gunY - kick * 0.05, gunZ - kick * 0.2);
      gun.rotation.set(-aimPitch - kick * 0.4, Math.sin(kick * 8) * 0.04, kick * 0.08);
      kick *= Math.pow(0.001, dt);
    }
    function updateGates(now) {
      const fade = phase === "aim" || phase === "power" || phase === "place";
      for (const gate of gates) {
        gate.xNow = gate.x + (gate.moving ? Math.sin(now * 0.001 * gate.speed + gate.phase) * gate.amp : 0);
        gate.group.position.x = gate.xNow;
        const opacity = fade ? 0.16 : (gate.used ? 0.28 : 0.72);
        gate.arch.material.opacity = opacity;
        gate.tag.material.opacity = fade ? 0.28 : 0.95;
      }
    }

    function onResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener("resize", onResize);
    onResize();

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button, a, #tut")) return;
      ensureAudio();
      hideTut();
      if (phase === "place") { dragging = true; dragX = e.clientX; }
      else if (phase === "aim") enterPower();
      else if (phase === "power") fire();
    });
    window.addEventListener("pointermove", (e) => {
      if (!dragging || phase !== "place") return;
      const span = Math.max(1.2, peakY * 0.9);
      gunX = clamp(gunX + ((e.clientX - dragX) / Math.max(1, window.innerWidth)) * span * 2.2, -span, span);
      dragX = e.clientX;
    });
    window.addEventListener("pointerup", () => {
      if (!dragging) return;
      dragging = false;
      if (phase === "place") { pitchHeld = false; enterAim(); }
    });
    window.addEventListener("pointercancel", () => { dragging = false; });
    window.addEventListener("keydown", (e) => {
      const span = Math.max(1.2, peakY * 0.9);
      if (e.key === "ArrowLeft" || e.key === "a") gunX = clamp(gunX - 0.08, -span, span);
      if (e.key === "ArrowRight" || e.key === "d") gunX = clamp(gunX + 0.08, -span, span);
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        ensureAudio();
        if (phase === "place") enterAim();
        else if (phase === "aim") enterPower();
        else if (phase === "power") fire();
        else if (phase === "result") loadStage(stageIndex);
      }
    });
    document.addEventListener("touchstart", (e) => { if (e.target === renderer.domElement) e.preventDefault(); }, { passive: false });
    document.addEventListener("touchmove", (e) => { if (phase === "place") e.preventDefault(); }, { passive: false });
    let lastTouch = 0;
    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouch < 350 && e.target === renderer.domElement) e.preventDefault();
      lastTouch = now;
    }, { passive: false });
    document.addEventListener("selectstart", (e) => e.preventDefault());
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("gesturestart", (e) => e.preventDefault());

    function hideTut() {
      if ($("tut").hidden) return;
      $("tut").hidden = true;
      seenTut = true;
      try { localStorage.setItem(TUT_KEY, "1"); } catch (e) {}
    }
    $("lang").addEventListener("click", () => {
      lang = lang === "ja" ? "en" : "ja";
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      applyLang();
    });
    $("sound").addEventListener("click", () => {
      muted = !muted;
      $("sound").setAttribute("aria-pressed", String(!muted));
      ensureAudio();
      applyLang();
    });
    $("retry").addEventListener("click", () => loadStage(stageIndex));
    $("again").addEventListener("click", () => loadStage(stageIndex));
    $("next").addEventListener("click", () => loadStage(stageIndex + 1));
    $("share").addEventListener("click", () => shareResult());
    $("post").addEventListener("click", () => {
      window.open("https://x.com/intent/post?text=" + encodeURIComponent(shareText()), "_blank", "noopener");
    });
    $("tut").addEventListener("pointerdown", (e) => { e.stopPropagation(); hideTut(); });

    let acc = 0;
    let last = performance.now();
    function frame(now) {
      const elapsed = Math.min(0.08, Math.max(0, (now - last) / 1000));
      const realDt = Math.min(0.033, elapsed);
      last = now;
      sfxBudget = 0;
      if ((phase === "aim" || phase === "place") && !pitchHeld) {
        aimPitch = pitchLo + (pitchHi - pitchLo) * wave(now, 2.55);
      }
      if (phase === "power") power = wave(now, 1.85);
      if ($("floater").style.opacity !== "0") {
        const next = Math.max(0, Number($("floater").style.opacity) - realDt * 0.8);
        $("floater").style.opacity = String(next);
      }
      if (phase === "fly") {
        shotWall += elapsed;
        const scale = now < slowUntil ? 0.45 : 1;
        acc += realDt * scale;
        let guard = 0;
        while (acc >= STEP && guard++ < 6) { step(STEP); acc -= STEP; }
        const quiet = aliveN === 0 && shotWall > 1.25;
        if (quiet || shotWall > 2.5) endShot();
      } else if (live.length) {
        integrateCans(Math.min(STEP, realDt));
      }
      if (phase !== "result") predict();
      updateGates(now);
      updateMarkers(now);
      drawCans();
      drawCorks();
      updateReticle();
      updateCamera(realDt);
      if (phase === "fly") {
        $("shotLabel").textContent = t().down(knocked);
        $("chainLabel").hidden = chain < 2;
        $("chainLabel").textContent = t().chain(chain);
      }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    camera.position.set(0, 1.1, -3.4);
    camera.lookAt(0, 1, 0.2);
    loadStage(0);
    if (!seenTut) {
      $("tut").hidden = false;
      setTimeout(hideTut, 3000);
    }
    window.__cans = {
      get phase() { return phase; },
      get score() { return knocked; },
      get knocked() { return knocked; },
      get standing() { return count - knocked; },
      get shots() { return shotsLeft; },
      get stage() { return stageDef().id; },
      get total() { return count; },
      get gunX() { return gunX; },
      get aimId() { return aimId; },
      get pitch() { return aimPitch; },
      get power() { return power; },
      get locked() { return lockedId; },
      get gates() { return gates.length; },
      get lang() { return lang; },
      get stars() { return starCount(); },
      keys() { return keys.slice(); },
      golds() { return golds.slice(); },
      nudge(dx) { const span = Math.max(1.2, peakY); gunX = clamp(gunX + dx, -span, span); },
      releasePlace() { if (phase === "place") enterAim(); },
      stopAim(v) { if (v != null) { aimPitch = v; pitchHeld = true; } if (phase === "aim") enterPower(); },
      stopPower(v) { if (v != null) power = v; if (phase === "power") fire(); },
      setShot(pitch, pow) { aimPitch = pitch; pitchHeld = true; if (pow != null) power = pow; },
      fireAt(i, pow) {
        if (state[i] !== 0) return false;
        gunX = ox[i];
        lockedId = i;
        if (pow != null) power = pow;
        if (phase === "place" || phase === "aim") phase = "power";
        fire();
        return true;
      },
      loadStage(n) { loadStage(n); },
      hideTut
    };
    requestAnimationFrame(frame);
  </script>
