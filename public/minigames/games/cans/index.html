<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>1万缶つみ射的</title>
  <meta name="description" content="夜店の射的。コルク銃で棚の1万缶を落とす。3発。位置、狙い、力の3タップ。">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hiroto1209-sketch.github.io/game-room/minigames/games/cans/">
  <meta property="og:title" content="1万缶つみ射的">
  <meta property="og:description" content="夜店の棚に積んだ1万缶を、コルク銃でどこまで落とせるか。">
  <meta property="og:image" content="https://hiroto1209-sketch.github.io/game-room/minigames/games/cans/icon.png">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="1万缶つみ射的">
  <meta name="twitter:description" content="夜店の棚に積んだ1万缶を、コルク銃でどこまで落とせるか。">
  <meta name="twitter:image" content="https://hiroto1209-sketch.github.io/game-room/minigames/games/cans/icon.png">
  <meta name="theme-color" content="#140816">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #140816;
      color: #fff8ea;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Yu Gothic", "WenQuanYi Micro Hei", "Droid Sans Fallback", "Hiragino Sans", Meiryo, system-ui, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; touch-action: none; }
    button, a { touch-action: manipulation; }
    a { color: inherit; }
    #top, #hint, #gauge, #count, #result, #floats, #fx { position: fixed; z-index: 2; }
    #fx, #floats, #count, #hint { pointer-events: none; }
    #top {
      z-index: 6;
      top: calc(8px + env(safe-area-inset-top));
      left: calc(8px + env(safe-area-inset-left));
      right: calc(8px + env(safe-area-inset-right));
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .pill, .hud-card {
      border: 0;
      border-radius: 999px;
      background: rgb(20 8 22 / 0.72);
      color: #fff8ea;
      box-shadow: inset 0 0 0 1px rgb(255 214 140 / 0.35);
    }
    .pill {
      font: inherit;
      font-weight: 700;
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cluster { display: flex; gap: 8px; }
    #stats {
      pointer-events: none;
      padding: 8px 14px;
      border-radius: 16px;
      background: rgb(20 8 22 / 0.72);
      box-shadow: inset 0 0 0 1px rgb(255 214 140 / 0.35);
      text-align: right;
      line-height: 1.25;
    }
    #stats b { display: block; font-size: 0.95rem; }
    #stats span { font-size: 0.78rem; opacity: 0.85; }
    #hint {
      left: 0;
      right: 0;
      bottom: calc(78px + env(safe-area-inset-bottom));
      text-align: center;
      font-weight: 700;
      font-size: clamp(0.95rem, 3.4vw, 1.25rem);
      text-shadow: 0 2px 0 #3a1020, 0 0 12px rgb(0 0 0 / 0.8);
      padding: 0 16px;
    }
    #gauge {
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(440px, calc(100vw - 28px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      height: 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, #3ecf7a, #ffe36a 55%, #ff5a3c);
      box-shadow: 0 6px 0 rgb(0 0 0 / 0.28), inset 0 0 0 2px rgb(255 255 255 / 0.35);
    }
    #gauge[hidden] { display: none; }
    #knob {
      position: absolute;
      top: -6px;
      width: 18px;
      height: 40px;
      margin-left: -9px;
      border-radius: 8px;
      background: #fff8ea;
      box-shadow: 0 2px 0 #5a3018;
    }
    #count {
      left: 0;
      right: 0;
      top: 16%;
      text-align: center;
      font-weight: 900;
      font-size: min(18vw, 96px);
      letter-spacing: -0.03em;
      color: #fffaf0;
      text-shadow: 0 4px 0 #7a2030, 0 0 24px #ffb020;
      display: none;
    }
    #count.show { display: block; }
    #floats { inset: 0; z-index: 3; }
    .floater {
      position: absolute;
      font-weight: 900;
      font-size: 28px;
      color: #ffe08a;
      text-shadow: 0 2px 0 #4a1028;
      transform: translate(-50%, -50%);
      will-change: transform, opacity;
    }
    #fx { inset: 0; width: 100%; height: 100%; z-index: 3; }
    #result {
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: rgb(8 2 12 / 0.45);
      padding: calc(12px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
    }
    #result[hidden] { display: none; }
    #card {
      width: min(440px, 100%);
      max-height: calc(100dvh - 24px);
      overflow: auto;
      border-radius: 24px;
      padding: 22px 18px 16px;
      background: #fff6e8;
      color: #3a1822;
      text-align: center;
      box-shadow: 0 18px 50px rgb(0 0 0 / 0.35);
    }
    #card h2 { margin: 0; font-size: 1rem; letter-spacing: 0.08em; }
    #big {
      margin: 4px 0;
      font-size: clamp(3rem, 12vw, 4.6rem);
      font-weight: 900;
      line-height: 1;
      color: #c5283d;
    }
    #of { margin: 0; font-weight: 700; }
    #stamp {
      display: inline-block;
      margin: 8px 0;
      padding: 4px 12px;
      border: 3px solid #c5283d;
      color: #c5283d;
      font-weight: 900;
      border-radius: 8px;
      transform: rotate(-6deg);
    }
    #stamp[hidden] { display: none; }
    #prize { margin: 8px 0; font-size: 1.35rem; font-weight: 900; }
    #bestline { margin: 0 0 12px; font-weight: 700; color: #8a5a32; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .actions button {
      font: inherit;
      font-weight: 800;
      min-height: 48px;
      padding: 0 16px;
      border-radius: 999px;
      border: 0;
      background: #3a1822;
      color: #fff6e8;
    }
    .actions button.ghost { background: transparent; color: #3a1822; box-shadow: inset 0 0 0 2px #3a1822; }
    @media (orientation: landscape) {
      #hint { bottom: calc(64px + env(safe-area-inset-bottom)); }
      #count { top: 8%; font-size: min(12vw, 84px); }
      #gauge { width: min(520px, 64vw); }
      #card { padding: 14px 16px 12px; }
      #big { font-size: clamp(2.4rem, 8vw, 3.6rem); }
    }
  </style>
</head>
<body>
  <div id="top">
    <div class="cluster">
      <a class="pill" id="back" href="../../">一覧</a>
      <button class="pill" id="lang" type="button">EN</button>
      <button class="pill" id="sound" type="button" aria-pressed="true">音</button>
    </div>
    <div id="stats">
      <b id="shotlabel">残り 3 発</b>
      <span id="bestlabel">ベスト 0</span>
    </div>
  </div>
  <div id="count"></div>
  <div id="hint"></div>
  <div id="gauge" hidden><div id="knob"></div></div>
  <div id="floats"></div>
  <canvas id="fx"></canvas>
  <div id="result" hidden>
    <div id="card">
      <h2 id="result-title">結果</h2>
      <div id="big">0</div>
      <p id="of">/ 10,000</p>
      <div id="stamp" hidden>全部落とし</div>
      <p id="prize">景品：飴</p>
      <p id="bestline"></p>
      <div class="actions">
        <button id="again" type="button">もう一回</button>
        <button id="share" type="button">共有</button>
        <button id="post" class="ghost" type="button">Xにポスト</button>
      </div>
    </div>
  </div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";

    const N = 10000;
    const W0 = 24;
    const D0 = 41;
    const LAYERS = 24;
    const PITCH = 0.21;
    const CAN_R = 0.092;
    const CAN_H = 0.23;
    const CORK_R = 0.055;
    const MAX_CORKS = 2000;
    const STEP = 1 / 90;
    const NEAR_CAP = 1800;
    const BEST_KEY = "cans-gallery:best";
    const LANG_KEY = "cans-gallery:lang";
    const PALETTE = ["#e23b3b", "#f2c14e", "#3db87a", "#f4f1ea", "#3a7bd5"];

    const TEXT = {
      ja: {
        title: "1万缶つみ射的",
        back: "一覧",
        soundOn: "音",
        soundOff: "消",
        lang: "EN",
        place: "ドラッグで左右。はなすと狙いへ",
        aim: "タップで狙いを止める",
        power: "タップで力を止める",
        fly: "コルク、飛んでます",
        shots: (n) => "残り " + n + " 発",
        best: (n) => "ベスト " + n.toLocaleString("ja-JP"),
        of: "/ 10,000",
        result: "結果",
        all: "全部落とし",
        candy: "景品：飴",
        toy: "景品：おもちゃ",
        grand: "景品：特賞",
        none: "景品なし",
        again: "もう一回",
        share: "共有",
        post: "Xにポスト",
        newBest: "ベスト更新",
        shareLine: (score, prize) => score >= 10000
          ? "1万缶つみ射的で全部落とし！（" + prize + "）"
          : "1万缶つみ射的で" + score.toLocaleString("ja-JP") + "缶倒した（" + prize + "）"
      },
      en: {
        title: "10,000 Can Gallery",
        back: "Games",
        soundOn: "Snd",
        soundOff: "Off",
        lang: "日本語",
        place: "Drag left or right, then release",
        aim: "Tap to stop the aim",
        power: "Tap to stop the power",
        fly: "Corks in the air",
        shots: (n) => n + (n === 1 ? " shot left" : " shots left"),
        best: (n) => "Best " + n.toLocaleString("en-US"),
        of: "/ 10,000",
        result: "Result",
        all: "ALL DOWN",
        candy: "Prize: candy",
        toy: "Prize: toy",
        grand: "Prize: grand",
        none: "No prize",
        again: "Again",
        share: "Share",
        post: "Post on X",
        newBest: "New best",
        shareLine: (score, prize) => score >= 10000
          ? "I cleared all 10,000 cans! (" + prize + ")"
          : "I knocked down " + score.toLocaleString("en-US") + " of 10,000 cans (" + prize + ")"
      }
    };

    const $ = (id) => document.getElementById(id);
    let lang = (() => {
      try {
        const v = localStorage.getItem(LANG_KEY);
        if (v === "ja" || v === "en") return v;
      } catch (e) {}
      return (navigator.language || "ja").toLowerCase().startsWith("ja") ? "ja" : "en";
    })();
    let muted = false;
    let best = 0;
    try { best = Math.max(0, Number(localStorage.getItem(BEST_KEY)) || 0); } catch (e) {}

    const px = new Float32Array(N);
    const py = new Float32Array(N);
    const pz = new Float32Array(N);
    const state = new Uint8Array(N);
    const support = new Uint8Array(N);
    const initSupport = new Uint8Array(N);
    const depN = new Uint8Array(N);
    const deps = new Int32Array(N * 4).fill(-1);
    const info = new Float32Array(N * 2);
    const hide = new Float32Array(N);
    const colors = new Float32Array(N * 3);
    const idOf = new Int32Array(LAYERS * 24 * 41).fill(-1);
    const at = (layer, ix, iz) => idOf[(layer * 24 + ix) * 41 + iz];
    const setAt = (layer, ix, iz, id) => { idOf[(layer * 24 + ix) * 41 + iz] = id; };

    let built = 0;
    for (let layer = 0; layer < LAYERS; layer++) {
      const w = W0 - layer;
      const d = D0 - layer;
      const y = CAN_H * 0.5 + layer * CAN_H;
      for (let ix = 0; ix < w; ix++) {
        for (let iz = 0; iz < d; iz++) {
          const id = built++;
          setAt(layer, ix, iz, id);
          px[id] = (ix - (w - 1) / 2) * PITCH;
          pz[id] = (iz - (d - 1) / 2) * PITCH - (-(D0 - 1) / 2) * PITCH;
          py[id] = y;
          info[id * 2] = -1;
          const hex = PALETTE[(ix + iz + layer) % PALETTE.length];
          const col = new THREE.Color(hex);
          colors[id * 3] = col.r;
          colors[id * 3 + 1] = col.g;
          colors[id * 3 + 2] = col.b;
          initSupport[id] = layer === 0 ? 1 : 0;
          support[id] = initSupport[id];
        }
      }
    }
    if (built !== N) throw new Error("can count " + built);

    for (let layer = 0; layer < LAYERS - 1; layer++) {
      const uw = W0 - (layer + 1);
      const ud = D0 - (layer + 1);
      for (let ix = 0; ix < uw; ix++) {
        for (let iz = 0; iz < ud; iz++) {
          const child = at(layer + 1, ix, iz);
          const legs = [[ix, iz], [ix + 1, iz], [ix, iz + 1], [ix + 1, iz + 1]];
          for (const [lx, lz] of legs) {
            const parent = at(layer, lx, lz);
            const n = depN[parent];
            deps[parent * 4 + n] = child;
            depN[parent] = n + 1;
            initSupport[child]++;
            support[child]++;
          }
        }
      }
    }

    let minX = Infinity;
    let minZ = Infinity;
    let maxX = -Infinity;
    let maxZ = -Infinity;
    for (let i = 0; i < N; i++) {
      if (px[i] < minX) minX = px[i];
      if (pz[i] < minZ) minZ = pz[i];
      if (px[i] > maxX) maxX = px[i];
      if (pz[i] > maxZ) maxZ = pz[i];
    }
    const CELL = 0.42;
    const GX = Math.ceil((maxX - minX) / CELL) + 3;
    const GZ = Math.ceil((maxZ - minZ) / CELL) + 3;
    const cellCount = GX * GZ;
    const cellStart = new Int32Array(cellCount + 1);
    const cellIndex = (x, z) => {
      let ix = Math.floor((x - minX) / CELL) + 1;
      let iz = Math.floor((z - minZ) / CELL) + 1;
      ix = Math.max(0, Math.min(GX - 1, ix));
      iz = Math.max(0, Math.min(GZ - 1, iz));
      return iz * GX + ix;
    };
    for (let i = 0; i < N; i++) cellStart[cellIndex(px[i], pz[i]) + 1]++;
    for (let c = 0; c < cellCount; c++) cellStart[c + 1] += cellStart[c];
    const cursor = new Int32Array(cellStart.subarray(0, cellCount));
    const items = new Int32Array(N);
    for (let i = 0; i < N; i++) items[cursor[cellIndex(px[i], pz[i])]++] = i;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x140816, 1);
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x140816);
    scene.fog = new THREE.Fog(0x140816, 16, 42);
    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.08, 80);

    scene.add(new THREE.HemisphereLight(0x9a8ad8, 0x3a2010, 0.9));
    const sun = new THREE.DirectionalLight(0xffd0a0, 1.2);
    sun.position.set(-3, 11, -6);
    scene.add(sun);

    const shelf = new THREE.Mesh(
      new THREE.BoxGeometry(maxX - minX + 1.4, 0.28, maxZ - minZ + 1.1),
      new THREE.MeshLambertMaterial({ color: 0x6b3d22 })
    );
    shelf.position.set((minX + maxX) / 2, -0.14, (minZ + maxZ) / 2);
    scene.add(shelf);
    const back = new THREE.Mesh(
      new THREE.BoxGeometry(maxX - minX + 1.6, 7.2, 0.18),
      new THREE.MeshLambertMaterial({ color: 0x4a241c })
    );
    back.position.set(0, 3.2, maxZ + 0.45);
    scene.add(back);
    const signCanvas = document.createElement("canvas");
    signCanvas.width = 512;
    signCanvas.height = 160;
    {
      const g = signCanvas.getContext("2d");
      g.fillStyle = "#f3e2c2";
      g.fillRect(0, 0, 512, 160);
      g.fillStyle = "#8d1d32";
      g.font = "700 92px sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText("射的", 256, 84);
    }
    const signTex = new THREE.CanvasTexture(signCanvas);
    signTex.colorSpace = THREE.SRGBColorSpace;
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(2.4, 0.75),
      new THREE.MeshBasicMaterial({ map: signTex })
    );
    sign.position.set(0, 6.15, maxZ + 0.34);
    sign.rotation.y = Math.PI;
    scene.add(sign);

    const lanterns = [];
    for (let i = 0; i < 6; i++) {
      const lantern = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 12, 10),
        new THREE.MeshBasicMaterial({ color: i % 2 ? 0xff5a3c : 0xffb03a })
      );
      const x = -2.4 + i * 0.95;
      lantern.position.set(x, 5.55, -0.4);
      scene.add(lantern);
      const string = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, 0.45, 5),
        new THREE.MeshLambertMaterial({ color: 0x5c3317 })
      );
      string.position.set(x, 5.95, -0.4);
      scene.add(string);
      lanterns.push(lantern);
    }

    function canLabelTexture() {
      const c = document.createElement("canvas");
      c.width = 64;
      c.height = 64;
      const g = c.getContext("2d");
      g.fillStyle = "#ffffff";
      g.fillRect(0, 0, 64, 64);
      g.fillStyle = "#2a2030";
      g.fillRect(0, 6, 64, 8);
      g.fillRect(0, 50, 64, 7);
      g.fillStyle = "#ffffff";
      g.fillRect(8, 22, 48, 16);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const canMat = new THREE.MeshLambertMaterial({ map: canLabelTexture() });
    const canGeo = new THREE.CylinderGeometry(CAN_R, CAN_R, CAN_H, 8);
    const nearMesh = new THREE.InstancedMesh(canGeo, canMat, NEAR_CAP);
    nearMesh.frustumCulled = false;
    nearMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    nearMesh.count = 0;
    scene.add(nearMesh);

    const pointGeo = new THREE.BufferGeometry();
    function packPos() {
      const arr = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        arr[i * 3] = px[i];
        arr[i * 3 + 1] = py[i];
        arr[i * 3 + 2] = pz[i];
      }
      return arr;
    }
    pointGeo.setAttribute("position", new THREE.BufferAttribute(packPos(), 3));
    pointGeo.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
    const infoAttr = new THREE.BufferAttribute(info, 2);
    infoAttr.setUsage(THREE.DynamicDrawUsage);
    pointGeo.setAttribute("aInfo", infoAttr);
    const hideAttr = new THREE.BufferAttribute(hide, 1);
    hideAttr.setUsage(THREE.DynamicDrawUsage);
    pointGeo.setAttribute("aHide", hideAttr);
    const pointMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uFall: { value: 0.85 },
        uSize: { value: 150 }
      },
      vertexShader: `
        attribute vec3 aColor;
        attribute vec2 aInfo;
        attribute float aHide;
        uniform float uTime;
        uniform float uFall;
        uniform float uSize;
        varying vec3 vColor;
        void main() {
          vColor = aColor;
          float falling = step(0.0, aInfo.x);
          float u = clamp((uTime - aInfo.x) / uFall, 0.0, 1.0) * falling;
          float tilt = 1.570796 * u * u;
          vec3 p = position;
          p.x += sin(aInfo.y) * tilt * 0.16;
          p.z += cos(aInfo.y) * tilt * 0.16;
          p.y -= u * u * 1.35;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          float done = step(0.98, u);
          gl_PointSize = mix(max(1.5, uSize * (0.72 + 0.28 * (1.0 - u)) / max(0.25, -mv.z)), 0.0, max(aHide, done));
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          vec2 c = gl_PointCoord - vec2(0.5);
          if (dot(c, c) > 0.25) discard;
          float rim = smoothstep(0.25, 0.08, dot(c, c));
          gl_FragColor = vec4(vColor * (0.7 + 0.4 * rim), 1.0);
        }
      `
    });
    const points = new THREE.Points(pointGeo, pointMat);
    points.frustumCulled = false;
    scene.add(points);

    const corkGeo = new THREE.SphereGeometry(CORK_R, 8, 6);
    const corkMat = new THREE.MeshLambertMaterial({ color: 0xc9854a });
    const corkMesh = new THREE.InstancedMesh(corkGeo, corkMat, MAX_CORKS);
    corkMesh.frustumCulled = false;
    corkMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    corkMesh.count = 0;
    scene.add(corkMesh);

    const gun = new THREE.Group();
    const stock = new THREE.Mesh(
      new THREE.BoxGeometry(0.16, 0.14, 0.55),
      new THREE.MeshLambertMaterial({ color: 0x6b4428 })
    );
    const barrel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.05, 0.7, 8),
      new THREE.MeshLambertMaterial({ color: 0x8d9198 })
    );
    barrel.rotation.x = Math.PI / 2;
    barrel.position.z = 0.45;
    gun.add(stock, barrel);
    scene.add(gun);
    const aimBeam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.02, 1, 6),
      new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.9 })
    );
    scene.add(aimBeam);
    const reticle = new THREE.Mesh(
      new THREE.TorusGeometry(0.16, 0.025, 6, 16),
      new THREE.MeshBasicMaterial({ color: 0xfff1c4 })
    );
    scene.add(reticle);
    const up = new THREE.Vector3(0, 1, 0);
    const dir = new THREE.Vector3();
    const dummy = new THREE.Object3D();
    const focus = new THREE.Vector3();
    const camLook = new THREE.Vector3();
    const tmpColor = new THREE.Color();

    const bx = new Float32Array(MAX_CORKS);
    const by = new Float32Array(MAX_CORKS);
    const bz = new Float32Array(MAX_CORKS);
    const vx = new Float32Array(MAX_CORKS);
    const vy = new Float32Array(MAX_CORKS);
    const vz = new Float32Array(MAX_CORKS);
    const corkMask = new Uint16Array(MAX_CORKS);
    const corkSkip = new Uint8Array(MAX_CORKS);
    const corkAlive = new Uint8Array(MAX_CORKS);
    const freeCorks = [];
    let aliveN = 0;
    let gates = [];
    let gateGroup = new THREE.Group();
    scene.add(gateGroup);

    let phase = "place";
    let gunX = 0;
    let aimPitch = 0.28;
    let power = 0.5;
    let shotsLeft = 3;
    let score = 0;
    let standing = N;
    let simTime = 0;
    let lastKnock = -10;
    let shotWall = 0;
    let slowUntil = 0;
    let shake = 0;
    let impacted = false;
    let dragging = false;
    let dragX = 0;
    let infoDirtyMin = N;
    let infoDirtyMax = -1;
    let sfxBudget = 0;
    let audioCtx = null;
    let countShown = false;
    let lastRumble = -10;
    const floaters = [];

    function wave(ms, period) {
      const f = ((ms / 1000) % period) / period;
      return f < 0.5 ? f * 2 : 2 - f * 2;
    }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function muzzle(out) {
      out.set(gunX, 1.02, -4.15);
      return out;
    }
    function aimVector(pitch) {
      const p = pitch == null ? aimPitch : pitch;
      dir.set(0, Math.sin(p), Math.cos(p));
      return dir;
    }
    function prizeId(n) {
      if (n >= 7000) return "grand";
      if (n >= 2000) return "toy";
      if (n >= 1) return "candy";
      return "none";
    }
    function prizeLabel(n) {
      return TEXT[lang][prizeId(n)];
    }
    function t() { return TEXT[lang]; }

    function applyLang() {
      const s = t();
      document.documentElement.lang = lang;
      document.title = s.title;
      $("back").textContent = s.back;
      $("lang").textContent = s.lang;
      $("sound").textContent = muted ? s.soundOff : s.soundOn;
      $("shotlabel").textContent = s.shots(shotsLeft);
      $("bestlabel").textContent = s.best(best);
      $("result-title").textContent = s.result;
      $("of").textContent = s.of;
      $("stamp").textContent = s.all;
      $("again").textContent = s.again;
      $("share").textContent = s.share;
      $("post").textContent = s.post;
      const hint = { place: s.place, aim: s.aim, power: s.power, fly: s.fly, result: "" };
      $("hint").textContent = hint[phase] || "";
      if (phase === "result") $("prize").textContent = prizeLabel(score);
    }

    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, dur, type, gain) {
      const ac = audioCtx;
      if (!ac || muted) return;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(gain, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + dur);
    }
    function playPop() { tone(180 + Math.random() * 40, 0.07, "sine", 0.12); }
    function playClang() {
      if (sfxBudget >= 3) return;
      sfxBudget++;
      tone(680 + Math.random() * 420, 0.09, "triangle", 0.08);
    }
    function playRumble() {
      const ac = audioCtx;
      if (!ac || muted) return;
      const frames = Math.floor(ac.sampleRate * 0.35);
      const buffer = ac.createBuffer(1, frames, ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
      const src = ac.createBufferSource();
      const filter = ac.createBiquadFilter();
      const g = ac.createGain();
      src.buffer = buffer;
      filter.type = "lowpass";
      filter.frequency.value = 240;
      g.gain.value = 0.2;
      src.connect(filter).connect(g).connect(ac.destination);
      src.start();
    }

    function markInfo(id) {
      if (id < infoDirtyMin) infoDirtyMin = id;
      if (id > infoDirtyMax) infoDirtyMax = id;
    }
    function flushInfo() {
      if (infoDirtyMax < infoDirtyMin) return;
      const start = infoDirtyMin * 2;
      const count = (infoDirtyMax - infoDirtyMin + 1) * 2;
      infoAttr.clearUpdateRanges();
      infoAttr.addUpdateRange(start, count);
      infoAttr.needsUpdate = true;
      infoDirtyMin = N;
      infoDirtyMax = -1;
    }

    function knock(id) {
      if (state[id] !== 0) return 0;
      const queue = [id];
      const depth = [0];
      let n = 0;
      for (let q = 0; q < queue.length; q++) {
        const cur = queue[q];
        if (state[cur] !== 0) continue;
        state[cur] = 1;
        const d = depth[q];
        info[cur * 2] = simTime + d * 0.028;
        info[cur * 2 + 1] = Math.random() * Math.PI * 2;
        markInfo(cur);
        standing--;
        score++;
        n++;
        lastKnock = simTime;
        const base = cur * 4;
        for (let k = 0; k < depN[cur]; k++) {
          const child = deps[base + k];
          if (child < 0 || state[child] !== 0) continue;
          support[child]--;
          const init = initSupport[child];
          const now = support[child];
          if (now * 2 <= init) {
            queue.push(child);
            depth.push(d + 1);
          }
        }
      }
      if (!impacted) {
        impacted = true;
        slowUntil = performance.now() + 600;
        shake = 0.42;
        countShown = true;
      }
      playClang();
      if (n > 24 && simTime - lastRumble > 0.45) {
        lastRumble = simTime;
        playRumble();
      }
      return n;
    }

    function forNearCans(x, z, fn) {
      const ix = Math.floor((x - minX) / CELL) + 1;
      const iz = Math.floor((z - minZ) / CELL) + 1;
      for (let dz = -1; dz <= 1; dz++) {
        for (let dx = -1; dx <= 1; dx++) {
          const cx = ix + dx;
          const cz = iz + dz;
          if (cx < 0 || cz < 0 || cx >= GX || cz >= GZ) continue;
          const c = cz * GX + cx;
          for (let k = cellStart[c]; k < cellStart[c + 1]; k++) fn(items[k]);
        }
      }
    }
    const HIT_R = (CAN_R + CORK_R) * (CAN_R + CORK_R);
    function hitAt(i, x, y, z) {
      let hit = false;
      forNearCans(x, z, (id) => {
        if (state[id] !== 0) return;
        const dx = x - px[id];
        const dz = z - pz[id];
        if (dx * dx + dz * dz > HIT_R) return;
        if (Math.abs(y - py[id]) > CAN_H * 0.5 + CORK_R) return;
        knock(id);
        hit = true;
      });
      return hit;
    }

    function spawnCork(x, y, z, svx, svy, svz, mask) {
      if (!freeCorks.length || aliveN >= MAX_CORKS) return -1;
      const i = freeCorks.pop();
      corkAlive[i] = 1;
      corkSkip[i] = 1;
      corkMask[i] = mask || 0;
      bx[i] = x;
      by[i] = y;
      bz[i] = z;
      vx[i] = svx;
      vy[i] = svy;
      vz[i] = svz;
      aliveN++;
      return i;
    }
    function killCork(i) {
      if (!corkAlive[i]) return;
      corkAlive[i] = 0;
      aliveN--;
      freeCorks.push(i);
    }

    function gateTexture(label) {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 128;
      const g = c.getContext("2d");
      g.clearRect(0, 0, 256, 128);
      g.fillStyle = "rgba(255, 236, 190, 0.92)";
      g.beginPath();
      g.rect(8, 16, 240, 96);
      g.fill();
      g.lineWidth = 8;
      g.strokeStyle = "#6a1230";
      g.stroke();
      g.fillStyle = "#3a1028";
      g.font = "700 64px sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(label, 128, 66);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    function popup(x, y, z, text) {
      const el = document.createElement("div");
      el.className = "floater";
      el.textContent = text;
      $("floats").appendChild(el);
      floaters.push({ el, x, y, z, age: 0 });
      if (floaters.length > 8) {
        const old = floaters.shift();
        old.el.remove();
      }
    }
    function clearGates() {
      for (const g of gates) {
        g.mesh.material.map.dispose();
        g.mesh.material.dispose();
        g.mesh.geometry.dispose();
      }
      gateGroup.clear();
      gates = [];
    }
    function buildGates() {
      clearGates();
      const cols = [-1.35, 0, 1.35];
      let bit = 0;
      for (let row = 0; row < 4; row++) {
        for (let c = 0; c < cols.length; c++) {
          if (Math.random() < 0.22) continue;
          if (bit > 11) continue;
          const moving = Math.random() < 0.34;
          const mul = Math.random() < 0.55;
          const n = mul ? [2, 2, 3, 3, 4, 5][(Math.random() * 6) | 0] : 8 + row * 6 + ((Math.random() * 8) | 0);
          const gate = {
            x: cols[c] + (Math.random() - 0.5) * 0.15,
            z: -3.15 + row * 0.72,
            w: moving ? 0.78 : 1.15,
            kind: mul ? "x" : "+",
            n,
            moving,
            amp: 0.42 + Math.random() * 0.25,
            speed: 0.7 + Math.random() * 0.9,
            phase: Math.random() * Math.PI * 2,
            used: false,
            bit,
            xNow: cols[c]
          };
          const label = (mul ? "×" : "+") + n;
          const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(gate.w, 3.4),
            new THREE.MeshBasicMaterial({ map: gateTexture(label), transparent: true, depthWrite: false, side: THREE.DoubleSide })
          );
          mesh.position.set(gate.x, 2.15, gate.z);
          gate.mesh = mesh;
          gateGroup.add(mesh);
          gates.push(gate);
          bit++;
        }
      }
    }
    function passGate(i, gate) {
      if (gate.kind === "+" && gate.used) return;
      const extra = gate.kind === "x" ? gate.n - 1 : gate.n;
      if (gate.kind === "+") {
        gate.used = true;
        gate.mesh.material.opacity = 0.28;
      }
      popup(gate.xNow, by[i] + 0.4, gate.z, (gate.kind === "x" ? "×" : "+") + gate.n);
      for (let k = 0; k < extra; k++) {
        spawnCork(
          bx[i] + (Math.random() - 0.5) * 0.2,
          by[i] + (Math.random() - 0.5) * 0.12,
          gate.z + 0.08,
          vx[i] + (Math.random() - 0.5) * 2.4,
          vy[i] + (Math.random() - 0.5) * 1.5,
          vz[i] * (0.94 + Math.random() * 0.08),
          corkMask[i] | (1 << gate.bit)
        );
      }
      playPop();
    }
    function tryGates(i, z0, z1) {
      for (let g = 0; g < gates.length; g++) {
        const gate = gates[g];
        if ((corkMask[i] & (1 << gate.bit)) !== 0) continue;
        if (!(z0 < gate.z && z1 >= gate.z)) continue;
        corkMask[i] |= 1 << gate.bit;
        if (Math.abs(bx[i] - gate.xNow) > gate.w * 0.5) continue;
        if (by[i] < 0.15 || by[i] > 6.4) continue;
        passGate(i, gate);
      }
    }

    function stepCork(i, dt) {
      const speed = Math.hypot(vx[i], vy[i], vz[i]);
      const sub = Math.max(1, Math.ceil((speed * dt) / 0.16));
      const h = dt / sub;
      for (let s = 0; s < sub; s++) {
        if (!corkAlive[i]) return;
        const z0 = bz[i];
        vy[i] -= 12 * h;
        vx[i] *= 1 - 0.12 * h;
        bx[i] += vx[i] * h;
        by[i] += vy[i] * h;
        bz[i] += vz[i] * h;
        tryGates(i, z0, bz[i]);
        if (hitAt(i, bx[i], by[i], bz[i])) {
          vz[i] *= 0.62;
          vy[i] *= 0.75;
          vx[i] += (Math.random() - 0.5) * 1.2;
          if (vz[i] < 3.5) {
            killCork(i);
            return;
          }
        }
        if (by[i] < -0.6 || bz[i] > maxZ + 0.8 || bz[i] < -8 || Math.abs(bx[i]) > 6) {
          killCork(i);
          return;
        }
      }
    }
    function step(dt) {
      simTime += dt;
      for (let i = 0; i < MAX_CORKS; i++) {
        if (!corkAlive[i] || corkSkip[i]) continue;
        stepCork(i, dt);
      }
      corkSkip.fill(0);
      flushInfo();
    }

    function enterAim() {
      phase = "aim";
      applyLang();
    }
    function enterPower() {
      phase = "power";
      applyLang();
    }
    function fire() {
      phase = "fly";
      shotsLeft--;
      impacted = false;
      shotWall = 0;
      countShown = score > 0;
      const o = muzzle(new THREE.Vector3());
      const d = aimVector();
      const speed = 11 + power * 22;
      spawnCork(o.x, o.y, o.z, d.x * speed, d.y * speed, d.z * speed, 0);
      playPop();
      applyLang();
    }
    function showResult() {
      phase = "result";
      $("hint").textContent = "";
      $("gauge").hidden = true;
      aimBeam.visible = false;
      reticle.visible = false;
      const fresh = score > best;
      if (fresh) {
        best = score;
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      }
      $("result").hidden = false;
      $("stamp").hidden = score !== 10000;
      $("prize").textContent = prizeLabel(score);
      $("bestline").textContent = fresh ? t().newBest : t().best(best);
      applyLang();
      $("bestline").textContent = fresh ? t().newBest : t().best(best);
      const t0 = performance.now();
      const tick = (now) => {
        const u = Math.min(1, (now - t0) / 900);
        const e = 1 - (1 - u) ** 3;
        $("big").textContent = Math.round(score * e).toLocaleString(lang === "ja" ? "ja-JP" : "en-US");
        if (u < 1) requestAnimationFrame(tick);
        else if (score === 10000) burst(160);
        else if (score >= 2000) burst(80);
      };
      requestAnimationFrame(tick);
      if (score >= 2000) burst(40);
    }
    function endShot() {
      if (shotsLeft <= 0 || standing <= 0) showResult();
      else {
        phase = "place";
        impacted = false;
        applyLang();
      }
    }
    function resetRound() {
      for (let i = 0; i < N; i++) {
        state[i] = 0;
        support[i] = initSupport[i];
        info[i * 2] = -1;
        info[i * 2 + 1] = 0;
        hide[i] = 0;
      }
      infoAttr.clearUpdateRanges();
      infoAttr.needsUpdate = true;
      standing = N;
      score = 0;
      shotsLeft = 3;
      phase = "place";
      gunX = 0;
      aimPitch = 0.28;
      power = 0.5;
      simTime = 0;
      lastKnock = -10;
      shotWall = 0;
      slowUntil = 0;
      shake = 0;
      impacted = false;
      countShown = false;
      aliveN = 0;
      freeCorks.length = 0;
      corkAlive.fill(0);
      for (let i = MAX_CORKS - 1; i >= 0; i--) freeCorks.push(i);
      buildGates();
      $("result").hidden = true;
      $("count").classList.remove("show");
      $("big").textContent = "0";
      applyLang();
    }

    const fx = $("fx");
    const fxCtx = fx.getContext("2d");
    const bits = [];
    function burst(n) {
      for (let i = 0; i < n; i++) {
        bits.push({
          x: Math.random() * fx.width,
          y: fx.height * (0.35 + Math.random() * 0.3),
          vx: (Math.random() - 0.5) * 8,
          vy: -3 - Math.random() * 6,
          g: 0.12 + Math.random() * 0.08,
          w: 4 + Math.random() * 5,
          h: 7 + Math.random() * 6,
          color: PALETTE[(Math.random() * PALETTE.length) | 0],
          life: 50 + Math.random() * 30
        });
      }
    }
    function drawFx() {
      fxCtx.clearRect(0, 0, fx.width, fx.height);
      for (let i = bits.length - 1; i >= 0; i--) {
        const b = bits[i];
        b.life--;
        b.vy += b.g;
        b.x += b.vx;
        b.y += b.vy;
        if (b.life <= 0 || b.y > fx.height) {
          bits.splice(i, 1);
          continue;
        }
        fxCtx.globalAlpha = Math.max(0, b.life / 40);
        fxCtx.fillStyle = b.color;
        fxCtx.fillRect(b.x, b.y, b.w, b.h);
      }
      fxCtx.globalAlpha = 1;
    }

    function shareText() {
      const url = location.href.split("#")[0];
      return t().shareLine(score, prizeLabel(score)) + "\n" + url + "\n#1万缶つみ射的";
    }
    function resultImage() {
      renderer.render(scene, camera);
      const w = 720;
      const h = 900;
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      const g = c.getContext("2d");
      const src = renderer.domElement;
      const scale = Math.max(w / src.width, h / src.height);
      const dw = src.width * scale;
      const dh = src.height * scale;
      g.drawImage(src, (w - dw) / 2, (h - dh) / 2, dw, dh);
      g.fillStyle = "rgba(12, 4, 16, 0.55)";
      g.fillRect(0, h * 0.62, w, h * 0.38);
      g.fillStyle = "#fff6e8";
      g.font = "700 42px sans-serif";
      g.textAlign = "center";
      g.fillText(t().title, w / 2, h * 0.72);
      g.fillStyle = "#ffd0dc";
      g.font = "900 92px sans-serif";
      g.fillText(score.toLocaleString(lang === "ja" ? "ja-JP" : "en-US"), w / 2, h * 0.84);
      g.font = "700 36px sans-serif";
      g.fillStyle = "#ffe08a";
      g.fillText(prizeLabel(score), w / 2, h * 0.92);
      return new Promise((resolve) => c.toBlob(resolve, "image/png"));
    }
    async function shareResult() {
      const text = shareText();
      const url = location.href.split("#")[0];
      try {
        const blob = await resultImage();
        const file = new File([blob], "10000-cans.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], text, url });
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
      try {
        if (navigator.share) {
          await navigator.share({ text, url });
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
      try { await navigator.clipboard.writeText(text); } catch (e) {}
    }
    function postX() {
      const href = "https://x.com/intent/post?text=" + encodeURIComponent(shareText());
      window.open(href, "_blank", "noopener");
    }

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / Math.max(1, h);
      camera.fov = w > h ? 40 : 52;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      fx.width = w;
      fx.height = h;
    }
    window.addEventListener("resize", onResize);
    onResize();

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button, a")) return;
      ensureAudio();
      if (phase === "place") {
        dragging = true;
        dragX = e.clientX;
      } else if (phase === "aim") enterPower();
      else if (phase === "power") fire();
    });
    window.addEventListener("pointermove", (e) => {
      if (!dragging || phase !== "place") return;
      const dx = (e.clientX - dragX) / Math.max(1, window.innerWidth);
      gunX = clamp(gunX + dx * 5.2, -2.05, 2.05);
      dragX = e.clientX;
    });
    window.addEventListener("pointerup", () => {
      if (!dragging) return;
      dragging = false;
      if (phase === "place") enterAim();
    });
    window.addEventListener("pointercancel", () => {
      if (dragging && phase === "place") enterAim();
      dragging = false;
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") gunX = clamp(gunX - 0.12, -2.05, 2.05);
      if (e.key === "ArrowRight" || e.key === "d") gunX = clamp(gunX + 0.12, -2.05, 2.05);
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        ensureAudio();
        if (phase === "place") enterAim();
        else if (phase === "aim") enterPower();
        else if (phase === "power") fire();
        else if (phase === "result") resetRound();
      }
    });
    document.addEventListener("touchstart", (e) => {
      if (e.target === renderer.domElement) e.preventDefault();
    }, { passive: false });
    document.addEventListener("touchmove", (e) => {
      if (phase === "place") e.preventDefault();
    }, { passive: false });
    let lastTouch = 0;
    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouch < 350 && e.target === renderer.domElement) e.preventDefault();
      lastTouch = now;
    }, { passive: false });
    document.addEventListener("selectstart", (e) => e.preventDefault());
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("gesturestart", (e) => e.preventDefault());

    $("lang").addEventListener("click", () => {
      lang = lang === "ja" ? "en" : "ja";
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      applyLang();
    });
    $("sound").addEventListener("click", () => {
      muted = !muted;
      $("sound").setAttribute("aria-pressed", String(!muted));
      ensureAudio();
      applyLang();
    });
    $("again").addEventListener("click", () => resetRound());
    $("share").addEventListener("click", () => shareResult());
    $("post").addEventListener("click", () => postX());

    function updateNear() {
      let candidates = 0;
      const r2 = 3.1 * 3.1;
      for (let i = 0; i < N; i++) {
        if (state[i] === 1 && simTime > info[i * 2] + 1.05) continue;
        const dx = px[i] - focus.x;
        const dy = py[i] - focus.y;
        const dz = pz[i] - focus.z;
        if (dx * dx + dy * dy + dz * dz < r2) candidates++;
      }
      const stride = Math.max(1, Math.ceil(candidates / NEAR_CAP));
      let seen = 0;
      let nearN = 0;
      hide.fill(0);
      for (let i = 0; i < N; i++) {
        const falling = state[i] === 1;
        const started = falling ? info[i * 2] : -1;
        const u = falling && started >= 0 ? clamp((simTime - started) / 0.85, 0, 1) : 0;
        if (u > 0.98) continue;
        const dx = px[i] - focus.x;
        const dy = py[i] - focus.y;
        const dz = pz[i] - focus.z;
        if (dx * dx + dy * dy + dz * dz >= r2) continue;
        seen++;
        if (seen % stride !== 0) continue;
        if (nearN >= NEAR_CAP) break;
        const tilt = 1.570796 * u * u;
        const yaw = info[i * 2 + 1];
        dummy.position.set(
          px[i] + Math.sin(yaw) * tilt * 0.16,
          py[i] - u * u * 1.35,
          pz[i] + Math.cos(yaw) * tilt * 0.16
        );
        dummy.rotation.set(Math.cos(yaw) * tilt, yaw * 0.15, -Math.sin(yaw) * tilt);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        nearMesh.setMatrixAt(nearN, dummy.matrix);
        tmpColor.setRGB(colors[i * 3], colors[i * 3 + 1], colors[i * 3 + 2]);
        nearMesh.setColorAt(nearN, tmpColor);
        hide[i] = 1;
        nearN++;
      }
      nearMesh.count = nearN;
      nearMesh.instanceMatrix.needsUpdate = true;
      if (nearMesh.instanceColor) nearMesh.instanceColor.needsUpdate = true;
      hideAttr.clearUpdateRanges();
      hideAttr.needsUpdate = true;
    }

    function updateCorkMeshes() {
      let n = 0;
      for (let i = 0; i < MAX_CORKS; i++) {
        if (!corkAlive[i]) continue;
        dummy.position.set(bx[i], by[i], bz[i]);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        corkMesh.setMatrixAt(n, dummy.matrix);
        n++;
        if (n === 1 || bz[i] > focus.z) focus.set(bx[i], by[i], bz[i]);
      }
      corkMesh.count = n;
      corkMesh.instanceMatrix.needsUpdate = true;
      return n;
    }

    function updateCamera(dt) {
      const wide = phase === "fly" && impacted;
      const tx = wide ? 0 : gunX * 0.25;
      const ty = wide ? 5.6 : 1.85;
      const tz = wide ? -8.4 : -6.5;
      const lx = wide ? 0 : gunX * 0.1;
      const ly = wide ? 2.5 : 2.15;
      const lz = wide ? 3.2 : 1.2;
      const k = 1 - Math.pow(0.001, dt);
      camera.position.x += (tx - camera.position.x) * k;
      camera.position.y += (ty - camera.position.y) * k;
      camera.position.z += (tz - camera.position.z) * k;
      if (shake > 0.001) {
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake;
        shake *= Math.pow(0.04, dt);
      }
      camLook.set(lx, ly, lz);
      camera.lookAt(camLook);
    }

    function updateGun(now) {
      if (phase === "aim") aimPitch = 0.05 + wave(now, 1.6) * 0.72;
      if (phase === "power") power = wave(now, 1.2);
      const o = muzzle(new THREE.Vector3());
      gun.position.copy(o);
      gun.rotation.set(-aimPitch, 0, 0);
      const d = aimVector();
      const len = 5.2;
      aimBeam.visible = phase === "aim" || phase === "power";
      reticle.visible = aimBeam.visible;
      aimBeam.scale.set(1, len, 1);
      aimBeam.position.set(o.x + d.x * len * 0.5, o.y + d.y * len * 0.5, o.z + d.z * len * 0.5);
      aimBeam.quaternion.setFromUnitVectors(up, d);
      const travel = (-0.16 - o.z) / d.z;
      reticle.position.set(o.x + d.x * travel, clamp(o.y + d.y * travel, 0.25, 6.2), -0.16);
      $("gauge").hidden = phase !== "power";
      if (phase === "power") $("knob").style.left = (power * 100) + "%";
      const showCount = (phase === "fly" || phase === "result") && countShown;
      const count = $("count");
      count.classList.toggle("show", showCount && phase !== "result");
      if (showCount) count.textContent = score.toLocaleString(lang === "ja" ? "ja-JP" : "en-US");
    }

    function updateFloaters(dt) {
      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i];
        f.age += dt;
        f.y += dt * 0.45;
        const v = new THREE.Vector3(f.x, f.y, f.z).project(camera);
        f.el.style.left = ((v.x * 0.5 + 0.5) * window.innerWidth) + "px";
        f.el.style.top = ((-v.y * 0.5 + 0.5) * window.innerHeight) + "px";
        f.el.style.opacity = String(Math.max(0, 1 - f.age / 0.8));
        if (f.age > 0.8) {
          f.el.remove();
          floaters.splice(i, 1);
        }
      }
    }

    let acc = 0;
    let last = performance.now();
    function frame(now) {
      const realDt = Math.min(0.033, (now - last) / 1000);
      last = now;
      sfxBudget = 0;
      if (phase !== "fly") simTime += realDt;
      else {
        shotWall += realDt;
        const scale = now < slowUntil ? 0.25 : 1;
        acc += realDt * scale;
        let guard = 0;
        while (acc >= STEP && guard++ < 6) {
          step(STEP);
          acc -= STEP;
        }
        const settled = aliveN === 0 && shotWall > 0.7 && (simTime - lastKnock > 1.6 || lastKnock < 0);
        if (settled || shotWall > 12) endShot();
      }
      const wall = performance.now() / 1000;
      for (const lantern of lanterns) lantern.position.y = 5.55 + Math.sin(wall * 1.7 + lantern.position.x) * 0.05;
      for (const gate of gates) {
        gate.xNow = gate.x + (gate.moving ? Math.sin(wall * gate.speed + gate.phase) * gate.amp : 0);
        gate.mesh.position.x = gate.xNow;
      }
      updateGun(now);
      if (phase === "fly" && aliveN > 0) updateCorkMeshes();
      else if (!(phase === "fly" && impacted)) focus.set(gunX, 2.2, 1.4);
      else updateCorkMeshes();
      if (!(phase === "fly" && aliveN > 0)) {
        if (impacted) focus.set(0, 2.4, 2);
        corkMesh.count = phase === "fly" ? corkMesh.count : 0;
      }
      pointMat.uniforms.uTime.value = simTime;
      updateNear();
      updateCamera(realDt);
      updateFloaters(realDt);
      renderer.render(scene, camera);
      drawFx();
      requestAnimationFrame(frame);
    }

    for (let i = MAX_CORKS - 1; i >= 0; i--) freeCorks.push(i);
    buildGates();
    camera.position.set(0, 1.85, -6.5);
    camera.lookAt(0, 2.15, 1.2);
    applyLang();

    window.__cans = {
      get phase() { return phase; },
      get score() { return score; },
      get standing() { return standing; },
      get shots() { return shotsLeft; },
      get gunX() { return gunX; },
      get gates() { return gates.length; },
      get cam() { return [camera.position.x, camera.position.y, camera.position.z]; },
      get impacted() { return impacted; },
      get total() { return N; },
      nudge(dx) { gunX = clamp(gunX + dx, -2.05, 2.05); },
      releasePlace() { if (phase === "place") enterAim(); },
      stopAim(v) { if (v != null) aimPitch = v; if (phase === "aim") enterPower(); },
      stopPower(v) { if (v != null) power = v; if (phase === "power") fire(); }
    };

    requestAnimationFrame(frame);
  </script>
</body>
</html>
