<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>1万本ボウリング</title>
  <meta name="description" content="夜店のレーン。ボールの曲がりと強さを止めて、1万本のピンを連鎖で倒す。3フレーム。">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hiroto1209-sketch.github.io/game-room/minigames/games/bowling/">
  <meta property="og:title" content="1万本ボウリング">
  <meta property="og:description" content="曲がりと強さを止めて、1万本のピンを連鎖で倒す。3フレーム。">
  <meta property="og:image" content="https://hiroto1209-sketch.github.io/game-room/minigames/games/bowling/icon.png">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="1万本ボウリング">
  <meta name="twitter:description" content="曲がりと強さを止めて、1万本のピンを連鎖で倒す。3フレーム。">
  <meta name="twitter:image" content="https://hiroto1209-sketch.github.io/game-room/minigames/games/bowling/icon.png">
  <meta name="theme-color" content="#140816">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; height: 100dvh; overflow: hidden;
      background: #140816; color: #fff8ea;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Yu Gothic", "WenQuanYi Micro Hei", "Droid Sans Fallback", "Hiragino Sans", Meiryo, system-ui, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    button, a { touch-action: manipulation; font: inherit; }
    a { color: inherit; text-decoration: none; }
    #top {
      position: fixed; z-index: 6;
      top: calc(8px + env(safe-area-inset-top));
      left: calc(8px + env(safe-area-inset-left));
      right: calc(8px + env(safe-area-inset-right));
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
      pointer-events: none;
    }
    #top button, #top a { pointer-events: auto; }
    .cluster { display: flex; flex-wrap: wrap; gap: 6px; max-width: 68%; }
    .pill {
      min-width: 44px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 999px;
      background: #2a1424; color: #fff8ea; font-weight: 800;
      box-shadow: inset 0 0 0 1px rgb(255 214 140 / 0.45);
      display: inline-flex; align-items: center; justify-content: center;
    }
    #stats {
      pointer-events: none; text-align: right; line-height: 1.2;
      background: #2a1424; color: #fff8ea; border-radius: 16px; padding: 8px 12px;
      box-shadow: inset 0 0 0 1px rgb(255 214 140 / 0.45);
    }
    #stats b { display: block; font-size: 0.98rem; }
    #stats span { display: block; font-size: 0.78rem; font-weight: 700; opacity: 0.92; }
    #count {
      position: fixed; z-index: 4; left: 0; right: 0; top: 18%;
      text-align: center; font-weight: 900; pointer-events: none;
      font-size: clamp(2.4rem, 12vw, 5rem); letter-spacing: -0.03em;
      color: #fff6ea; text-shadow: 0 3px 0 #5a1028, 0 0 18px rgb(90 16 40 / 0.65);
    }
    #count[hidden] { display: none; }
    #banner {
      position: fixed; z-index: 5; left: 50%; top: 30%; transform: translateX(-50%);
      background: #c5283d; color: #fff6ea; font-weight: 900;
      font-size: clamp(1.4rem, 6vw, 2.2rem); padding: 10px 22px; border-radius: 16px;
      box-shadow: 0 10px 28px rgb(0 0 0 / 0.28); pointer-events: none;
    }
    #banner[hidden] { display: none; }
    #flash { position: fixed; inset: 0; z-index: 3; background: #fff6ea; opacity: 0; pointer-events: none; }
    #hint {
      position: fixed; z-index: 4; left: 12px; right: 12px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      text-align: center; font-weight: 800; pointer-events: none;
      font-size: clamp(0.95rem, 3.6vw, 1.2rem);
      text-shadow: 0 2px 0 #3a1020;
    }
    #backPhase {
      position: fixed; z-index: 6;
      left: calc(12px + env(safe-area-inset-left));
      bottom: calc(86px + env(safe-area-inset-bottom));
      min-width: 64px; min-height: 46px;
    }
    #backPhase[hidden] { display: none; }
    #gauge {
      position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
      bottom: calc(52px + env(safe-area-inset-bottom));
      width: min(300px, 74vw); height: 18px; border-radius: 999px;
      background: linear-gradient(90deg, #6a3048 0 58%, #ffe36a 58% 88%, #ff8a3a 88%);
      box-shadow: inset 0 0 0 2px #fff6e0;
    }
    #gauge[hidden] { display: none; }
    #sweet {
      position: absolute; left: 58%; top: -3px; bottom: -3px; width: 30%;
      border-radius: 999px; box-shadow: inset 0 0 0 2px #fffaf0;
      pointer-events: none;
    }
    #knob {
      position: absolute; top: -5px; width: 14px; height: 28px; margin-left: -7px;
      border-radius: 6px; background: #fffaf0; box-shadow: 0 2px 0 #5a3018;
    }
    #floater {
      position: fixed; z-index: 4; left: 50%; top: 42%;
      transform: translateX(-50%); font-weight: 900; font-size: 1.6rem; color: #ffe08a;
      text-shadow: 0 2px 0 #5a1020, 0 0 12px #5a1020; pointer-events: none; opacity: 0;
    }
    #tut {
      position: fixed; z-index: 7; inset: 0; display: grid; place-items: end center;
      padding: calc(12px + env(safe-area-inset-bottom)) 16px 18vh;
      background: linear-gradient(transparent, rgb(12 4 16 / 0.28) 40%, rgb(12 4 16 / 0.45));
    }
    #tut[hidden] { display: none; }
    #tut .row { display: flex; gap: 10px; }
    #tut .step {
      width: 96px; min-height: 96px; border-radius: 20px; background: #fff6e8; color: #3a1822;
      display: grid; place-items: center; text-align: center; font-weight: 900; line-height: 1.15;
      box-shadow: 0 10px 24px rgb(0 0 0 / 0.28);
    }
    #tut .step b { font-size: 1.6rem; color: #c5283d; }
    #tut .step span { font-size: 0.78rem; }
    #result {
      position: fixed; z-index: 5; inset: 0; display: grid; place-items: center;
      background: rgb(8 2 12 / 0.42);
      padding: calc(64px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    }
    #result[hidden] { display: none; }
    #card {
      width: min(440px, 100%); max-height: 100%; overflow: auto; text-align: center;
      background: #fff6e8; color: #3a1822; border-radius: 24px; padding: 18px 16px 14px;
    }
    #stars { margin: 4px 0; font-size: 2rem; letter-spacing: 0.12em; color: #e0a020; }
    #rank { font-size: 1.25rem; font-weight: 900; }
    #big { font-size: clamp(3rem, 12vw, 4.4rem); font-weight: 900; line-height: 0.95; color: #c5283d; }
    #lines { margin: 8px 0; font-weight: 800; line-height: 1.45; }
    #bestline { margin: 0 0 8px; font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .actions button { min-height: 46px; padding: 0 14px; border: 0; border-radius: 999px; background: #3a1822; color: #fff6e8; font-weight: 800; }
    .actions button.ghost { background: transparent; color: #3a1822; box-shadow: inset 0 0 0 2px #3a1822; }
    @media (orientation: landscape) {
      #tut { place-items: center; padding-bottom: 12px; }
      #hint { bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 0.95rem; }
      #gauge { bottom: calc(48px + env(safe-area-inset-bottom)); }
      #backPhase { bottom: calc(72px + env(safe-area-inset-bottom)); }
      #count { top: 12%; }
    }
  </style>
</head>
<body>
  <header id="top">
    <div class="cluster">
      <a class="pill" id="back" href="../../">一覧</a>
      <button class="pill" id="lang" type="button">EN</button>
      <button class="pill" id="sound" type="button" aria-pressed="true">音</button>
      <button class="pill" id="retry" type="button">やり直し</button>
    </div>
    <div id="stats">
      <b id="frameLabel">第1フレーム</b>
      <span id="rollLabel">1投目</span>
      <span id="totalLabel">合計 0</span>
    </div>
  </header>
  <div id="flash"></div>
  <div id="count" hidden>0</div>
  <div id="banner" hidden></div>
  <div id="floater"></div>
  <p id="hint">横にドラッグして置く</p>
  <button class="pill" id="backPhase" type="button" hidden>戻る</button>
  <div id="gauge" hidden><i id="sweet"></i><i id="knob"></i></div>
  <div id="tut" hidden>
    <div class="row">
      <div class="step"><b>1</b><span id="tut1">横にずらす</span></div>
      <div class="step"><b>2</b><span id="tut2">曲がりを止める</span></div>
      <div class="step"><b>3</b><span id="tut3">強さを止める</span></div>
    </div>
  </div>
  <div id="result" hidden>
    <div id="card">
      <div id="rank">見習い</div>
      <div id="stars">☆☆☆</div>
      <div id="big">0</div>
      <div id="lines"></div>
      <p id="bestline"></p>
      <div class="actions">
        <button id="again" type="button">もう一回</button>
        <button id="share" type="button">共有</button>
        <button id="post" class="ghost" type="button">Xにポスト</button>
      </div>
    </div>
  </div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";

    const N = 10000;
    const FULL = 140;
    const TAIL = 130;
    const GAP = 0.42;
    const ROW = 0.36;
    const CELL = 0.5;
    const NEIGHBOR = 0.62;
    const HIT = 0.31;
    const LANE = 1.12;
    const START_Z = -6.7;
    const BALL_R = 0.18;
    const MAX_BALLS = 48;
    const BODY_MAX = 160;
    const STEP = 1 / 90;
    const STRIKE = 700;
    const SPARE = 1050;
    const STAR = [450, 1000, 1800];
    const PAGE = "https://hiroto1209-sketch.github.io/game-room/minigames/games/bowling/";
    const LANG_KEY = "bowling-lane:v1:lang";
    const TUT_KEY = "bowling-lane:v1:tut";
    const BEST_KEY = "bowling-lane:v1:best";

    const TEXT = {
      ja: {
        title: "1万本ボウリング", back: "一覧", lang: "EN", soundOn: "音", soundOff: "消",
        retry: "やり直し", backPhase: "戻る",
        place: "横にドラッグして置く", curve: "タップで曲がりを止める", power: "白枠で強さを止める",
        roll: "転がっています", gutter: "ガター", strike: "ストライク", spare: "スペア", pins: "本",
        frame: (n) => "第" + n + "フレーム", rollN: (n) => n + "投目", total: (n) => "合計 " + n,
        tut1: "横にずらす", tut2: "曲がりを止める", tut3: "強さを止める",
        again: "もう一回", share: "共有", post: "Xにポスト",
        ranks: ["見習い", "夜店", "名人", "万本"],
        best: (n) => "ベスト " + n, newBest: "ベスト更新",
        lineStrike: (i, a) => "第" + i + "フレーム  " + a + "  ストライク",
        lineSpare: (i, a, b) => "第" + i + "フレーム  " + a + " + " + b + "  スペア",
        lineOpen: (i, a, b) => "第" + i + "フレーム  " + a + " + " + b,
        shareLine: (score, stars) => "1万本ボウリング " + score + "本 " + stars + "\n" + PAGE + "\n#1万本ボウリング"
      },
      en: {
        title: "10,000 Pin Roll", back: "Games", lang: "日本語", soundOn: "Snd", soundOff: "Off",
        retry: "Retry", backPhase: "Back",
        place: "Drag to place", curve: "Tap to stop the curve", power: "Stop inside the bracket",
        roll: "Rolling", gutter: "Gutter", strike: "Strike", spare: "Spare", pins: " pins",
        frame: (n) => "Frame " + n, rollN: (n) => "Roll " + n, total: (n) => "Total " + n,
        tut1: "Slide", tut2: "Stop curve", tut3: "Stop power",
        again: "Again", share: "Share", post: "Post",
        ranks: ["Novice", "Stall", "Master", "Ten Thousand"],
        best: (n) => "Best " + n, newBest: "New best",
        lineStrike: (i, a) => "Frame " + i + "  " + a + "  Strike",
        lineSpare: (i, a, b) => "Frame " + i + "  " + a + " + " + b + "  Spare",
        lineOpen: (i, a, b) => "Frame " + i + "  " + a + " + " + b,
        shareLine: (score, stars) => "10,000 Pin Roll " + score + " pins " + stars + "\n" + PAGE + "\n#10000PinRoll"
      }
    };

    const GATES = [
      { z: -5.15, x: -0.64, w: 0.56, kind: "mul", n: 2, move: 0, label: "×2" },
      { z: -3.9, x: 0.62, w: 0.5, kind: "mul", n: 3, move: 0.46, label: "×3" },
      { z: -2.6, x: 0.5, w: 0.46, kind: "add", n: 5, move: 0, label: "+5" }
    ];

    const $ = (id) => document.getElementById(id);
    const lite = (navigator.hardwareConcurrency || 8) <= 4;
    const bodyCap = lite ? 60 : 140;
    const nearCap = lite ? 420 : 880;
    let dprCap = lite ? 1 : 1.5;
    let lang = "ja";
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "ja") lang = saved;
    } catch (e) {}
    let muted = false;
    let seenTut = false;
    try { seenTut = localStorage.getItem(TUT_KEY) === "1"; } catch (e) {}

    const px = new Float32Array(N);
    const pz = new Float32Array(N);
    const rowOf = new Uint8Array(N);
    const state = new Uint8Array(N);
    const fallAt = new Float32Array(N);
    const fallAng = new Float32Array(N);
    const info = new Float32Array(N * 2);
    const hide = new Float32Array(N);
    const queue = new Int32Array(N);
    const seen = new Int32Array(N);
    const hop = new Uint16Array(N);

    const bx = new Float32Array(MAX_BALLS);
    const by = new Float32Array(MAX_BALLS);
    const bz = new Float32Array(MAX_BALLS);
    const bvx = new Float32Array(MAX_BALLS);
    const bvz = new Float32Array(MAX_BALLS);
    const bspin = new Float32Array(MAX_BALLS);
    const bscale = new Float32Array(MAX_BALLS);
    const bdelay = new Float32Array(MAX_BALLS);
    const balive = new Uint8Array(MAX_BALLS);
    const bmask = new Uint8Array(MAX_BALLS);
    const bflood = new Uint8Array(MAX_BALLS);
    const brot = new Float32Array(MAX_BALLS);

    const bodyId = new Int32Array(BODY_MAX);
    const bodyX = new Float32Array(BODY_MAX);
    const bodyY = new Float32Array(BODY_MAX);
    const bodyZ = new Float32Array(BODY_MAX);
    const bodyVx = new Float32Array(BODY_MAX);
    const bodyVy = new Float32Array(BODY_MAX);
    const bodyVz = new Float32Array(BODY_MAX);
    const bodySpin = new Float32Array(BODY_MAX);

    let id = 0;
    for (let r = 0; r < 141; r++) {
      const n = r < FULL ? r + 1 : TAIL;
      const z = r * ROW;
      for (let i = 0; i < n; i++, id++) {
        px[id] = (i - (n - 1) / 2) * GAP;
        pz[id] = z;
        rowOf[id] = r;
        info[id * 2] = 1e9;
      }
    }
    if (id !== N) throw new Error("pin count " + id);

    let minX = 0, minZ = -1, GW = 1, GH = 1, cellStart, items;
    {
      let lo = 1e9, hi = -1e9, far = 0;
      for (let i = 0; i < N; i++) {
        if (px[i] < lo) lo = px[i];
        if (px[i] > hi) hi = px[i];
        if (pz[i] > far) far = pz[i];
      }
      minX = lo - 1;
      const maxX = hi + 1;
      const maxZ = far + 1;
      GW = Math.ceil((maxX - minX) / CELL);
      GH = Math.ceil((maxZ - minZ) / CELL);
      const cells = GW * GH;
      cellStart = new Int32Array(cells + 1);
      items = new Int32Array(N);
      const cellOf = (x, z) => {
        let cx = (x - minX) / CELL | 0;
        let cz = (z - minZ) / CELL | 0;
        if (cx < 0) cx = 0; else if (cx >= GW) cx = GW - 1;
        if (cz < 0) cz = 0; else if (cz >= GH) cz = GH - 1;
        return cx + cz * GW;
      };
      for (let i = 0; i < N; i++) cellStart[cellOf(px[i], pz[i]) + 1]++;
      for (let c = 0; c < cells; c++) cellStart[c + 1] += cellStart[c];
      const cur = cellStart.slice(0, cells);
      for (let i = 0; i < N; i++) items[cur[cellOf(px[i], pz[i])]++] = i;
    }

    let ballX = 0;
    let spinLock = 0;
    let power = 0.2;
    let phase = "place";
    let frameNo = 0;
    let rollNo = 0;
    let totalScore = 0;
    let rollKnock = 0;
    let rollCap = 0;
    let opened = false;
    let ballN = 0;
    let bodyN = 0;
    let simTime = 0;
    let stamp = 1;
    let shake = 0;
    let flash = 0;
    let slowLeft = 0;
    let didSlow = false;
    let rollStarted = 0;
    let quietAt = 0;
    let markUntil = 0;
    let audioCtx = null;
    let sfxBudget = 0;
    let noiseBuf = null;
    let dragging = false;
    let dragOrigin = 0;
    let dragBall = 0;
    let pointerId = -1;
    let infoLo = N;
    let infoHi = -1;
    let ageCursor = 0;
    let newBest = false;
    let lastImpact = null;
    const frameRolls = [[0, 0], [0, 0], [0, 0]];
    const frameMarks = ["", "", ""];
    const nearIds = new Int32Array(nearCap);
    const prevIds = new Int32Array(nearCap);
    let prevNear = 0;
    const dummy = new THREE.Object3D();
    const look = new THREE.Vector3(0, 0.3, 0.85);
    const camPos = new THREE.Vector3(0, 0.7, START_Z - 2.05);

    const renderer = new THREE.WebGLRenderer({
      antialias: !lite,
      powerPreference: "high-performance",
      alpha: false
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x140816, 1);
    document.body.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x140816);
    scene.fog = new THREE.Fog(0x140816, 14, 36);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.06, 90);
    scene.add(new THREE.HemisphereLight(0xfff1dc, 0x241028, 1.05));
    const sun = new THREE.DirectionalLight(0xfff4e4, 1.25);
    sun.position.set(-2.4, 8, -6);
    scene.add(sun);

    function pinTexture() {
      const c = document.createElement("canvas");
      c.width = 64; c.height = 128;
      const g = c.getContext("2d");
      g.fillStyle = "#fff6ea";
      g.fillRect(0, 0, 64, 128);
      g.fillStyle = "#c5283d";
      g.fillRect(0, 46, 64, 10);
      g.fillRect(0, 62, 64, 6);
      g.fillStyle = "#e0a020";
      g.fillRect(0, 74, 64, 5);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }
    function ballTexture() {
      const c = document.createElement("canvas");
      c.width = 64; c.height = 64;
      const g = c.getContext("2d");
      g.fillStyle = "#c4163a";
      g.fillRect(0, 0, 64, 64);
      g.strokeStyle = "#ffd36a";
      g.lineWidth = 5;
      g.beginPath();
      g.arc(32, 32, 20, 0.2, 1.4);
      g.stroke();
      g.fillStyle = "#ff8aa8";
      g.beginPath();
      g.arc(24, 22, 7, 0, 6.3);
      g.fill();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    function laneTexture() {
      const c = document.createElement("canvas");
      c.width = 32; c.height = 128;
      const g = c.getContext("2d");
      g.fillStyle = "#4a2c1c";
      g.fillRect(0, 0, 32, 128);
      g.fillStyle = "#5a3824";
      for (let y = 0; y < 128; y += 9) g.fillRect(0, y, 32, 3);
      g.fillStyle = "#ffe08a";
      g.fillRect(0, 40, 32, 2);
      g.fillRect(0, 70, 32, 2);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 4);
      return tex;
    }
    function labelTexture(text) {
      const c = document.createElement("canvas");
      c.width = 128; c.height = 64;
      const g = c.getContext("2d");
      g.clearRect(0, 0, 128, 64);
      g.fillStyle = "#fff6ea";
      g.font = "700 42px sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(text, 64, 34);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const pinPts = [
      [0.02, 0], [0.115, 0.02], [0.125, 0.18], [0.07, 0.32],
      [0.042, 0.38], [0.058, 0.46], [0.02, 0.52]
    ].map((p) => new THREE.Vector2(p[0], p[1]));
    const pinGeo = new THREE.LatheGeometry(pinPts, lite ? 7 : 8);
    const pinMat = new THREE.MeshLambertMaterial({ map: pinTexture() });
    const pinMesh = new THREE.InstancedMesh(pinGeo, pinMat, nearCap);
    pinMesh.frustumCulled = false;
    pinMesh.count = 0;
    pinMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(pinMesh);

      else if (rollNo === 1 && frameRolls[frameNo][0] + rollKnock >= SPARE) showBanner(s.spare);
      else showBanner(fmt(rollKnock) + s.pins);
      if (rollKnock >= STRIKE) tone(523, 0.18, "triangle", 0.08);
      phase = "mark";
      markUntil = performance.now() + 820;
      $("count").hidden = true;
    }
    function afterMark() {
      hideBanner();
      const knocked = frameRolls[frameNo][rollNo];
      if (rollNo === 0 && knocked >= STRIKE) {
        frameMarks[frameNo] = "X";
        frameNo++;
        rollNo = 0;
        if (frameNo >= 3) showResult();
        else { resetRack(); ballX = 0; phase = "place"; }
      } else if (rollNo === 0) {
        rollNo = 1;
        phase = "place";
      } else {
        const sum = frameRolls[frameNo][0] + frameRolls[frameNo][1];
        frameMarks[frameNo] = sum >= SPARE ? "/" : "open";
        frameNo++;
        rollNo = 0;
        if (frameNo >= 3) showResult();
        else { resetRack(); ballX = 0; phase = "place"; }
      }
      applyHud();
    }
    function paintResult() {
      const stars = starCount(totalScore);
      const s = t();
      $("stars").textContent = starText(stars);
      $("rank").textContent = s.ranks[stars];
      $("big").textContent = fmt(totalScore);
      const lines = [];
      for (let i = 0; i < 3; i++) {
        const a = fmt(frameRolls[i][0]);
        const b = fmt(frameRolls[i][1]);
        if (frameMarks[i] === "X") lines.push(s.lineStrike(i + 1, a));
        else if (frameMarks[i] === "/") lines.push(s.lineSpare(i + 1, a, b));
        else lines.push(s.lineOpen(i + 1, a, b));
      }
      $("lines").textContent = lines.join("\n");
      $("lines").style.whiteSpace = "pre-line";
      const best = readBest();
      $("bestline").textContent = newBest ? s.newBest + "  " + fmt(totalScore) : s.best(fmt(Math.max(best, totalScore)));
    }
    function showResult() {
      phase = "result";
      const best = readBest();
      newBest = totalScore > best;
      if (newBest) {
        try { localStorage.setItem(BEST_KEY, String(totalScore)); } catch (e) {}
      }
      paintResult();
      $("result").hidden = false;
      applyHud();
    }
    function shareText() {
      return t().shareLine(fmt(totalScore), starText(starCount(totalScore)));
    }
    async function shareResult() {
      const text = shareText();
      try {
        renderer.render(scene, camera);
        const src = renderer.domElement;
        const c = document.createElement("canvas");
        c.width = 720; c.height = 720;
        const g = c.getContext("2d");
        g.fillStyle = "#140816";
        g.fillRect(0, 0, 720, 720);
        const side = Math.min(src.width, src.height);
        g.drawImage(src, (src.width - side) / 2, (src.height - side) / 2, side, side, 0, 0, 720, 720);
        g.fillStyle = "rgba(20,8,22,0.72)";
        g.fillRect(0, 470, 720, 250);
        g.fillStyle = "#fff6ea";
        g.font = "700 42px sans-serif";
        g.textAlign = "center";
        g.fillText(t().title, 360, 530);
        g.fillStyle = "#c5283d";
        g.font = "900 92px sans-serif";
        g.fillText(fmt(totalScore), 360, 630);
        g.fillStyle = "#e0a020";
        g.font = "700 36px sans-serif";
        g.fillText($("stars").textContent + "  " + $("rank").textContent, 360, 680);
        const blob = await new Promise((res) => c.toBlob(res, "image/png"));
        const file = new File([blob], "bowling.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ text, files: [file] });
          return;
        }
        if (navigator.share) {
          await navigator.share({ text });
          return;
        }
      } catch (e) {}
      try { await navigator.clipboard.writeText(text); } catch (e) {}
    }

    function predict() {
      aimPts.length = 0;
      aimPin = -1;
      aimGutter = false;
      let x = ballX;
      let z = START_Z;
      let vx = (phase === "place" ? 0 : spinLock) * 0.25;
      let vz = 8 + (phase === "power" ? power : 0.74) * 11;
      const spin = phase === "place" ? 0 : spinLock;
      for (let n = 0; n < 150 && aimPts.length < 26; n++) {
        const sp = Math.hypot(vx, vz);
        const sub = Math.max(1, Math.ceil((sp * STEP) / 0.18));
        const h = STEP / sub;
        let stop = false;
        for (let s = 0; s < sub; s++) {
          vx += spin * 4.2 * h;
          vx *= 1 - 0.55 * h;
          vz *= 1 - 0.22 * h;
          x += vx * h;
          z += vz * h;
          if (z < -0.15 && Math.abs(x) > LANE) {
            aimGutter = true;
            stop = true;
            break;
          }
          if (z > -0.45) {
            const hit = findHit(x, z);
            if (hit >= 0) {
              aimPin = hit;
              stop = true;
              break;
            }
          }
        }
        aimPts.push(x, 0.07, z);
        if (stop || z > 8) break;
      }
    }
    function drawAim() {
      const show = phase === "place" || phase === "curve" || phase === "power";
      const n = show ? aimPts.length / 3 : 0;
      dots.count = n | 0;
      for (let i = 0; i < n; i++) {
        dummy.position.set(aimPts[i * 3], aimPts[i * 3 + 1], aimPts[i * 3 + 2]);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.setScalar(1);
        dummy.updateMatrix();
        dots.setMatrixAt(i, dummy.matrix);
      }
      if (n) dots.instanceMatrix.needsUpdate = true;
      if (show && aimPin >= 0) {
        reticle.visible = true;
        reticle.position.set(px[aimPin], 0.28, pz[aimPin]);
        reticle.material.color.setHex(aimGutter ? 0xff5a7a : 0xfff6c8);
      } else if (show && aimGutter) {
        reticle.visible = true;
        const last = Math.max(0, n - 1);
        reticle.position.set(aimPts[last * 3] || 0, 0.2, aimPts[last * 3 + 2] || START_Z);
        reticle.material.color.setHex(0xff5a7a);
      } else reticle.visible = false;
    }
    function drawBalls() {
      let n = 0;
      for (let i = 0; i < ballN; i++) {
        if (!balive[i] && phase === "roll") continue;
        if (phase !== "roll" && i > 0) continue;
        const x = phase === "roll" ? bx[i] : ballX;
        const y = phase === "roll" ? by[i] : BALL_R;
        const z = phase === "roll" ? bz[i] : START_Z;
        dummy.position.set(x, y, z);
        dummy.rotation.set(phase === "roll" ? brot[i] : 0, 0, 0);
        dummy.scale.setScalar(1);
        dummy.updateMatrix();
        ballMesh.setMatrixAt(n++, dummy.matrix);
      }
      if (phase !== "roll") {
        dummy.position.set(ballX, BALL_R, START_Z);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        if (n === 0) ballMesh.setMatrixAt(n++, dummy.matrix);
      }
      ballMesh.count = n;
      ballMesh.instanceMatrix.needsUpdate = true;
    }
    function drawPins() {
      let n = 0;
      for (let b = 0; b < bodyN && n < nearCap; b++) {
        const pid = bodyId[b];
        if (state[pid] !== 3) continue;
        dummy.position.set(bodyX[b], bodyY[b], bodyZ[b]);
        dummy.rotation.set(bodySpin[b], fallAng[pid], bodySpin[b] * 0.5);
        dummy.scale.setScalar(1);
        dummy.updateMatrix();
        pinMesh.setMatrixAt(n, dummy.matrix);
        nearIds[n++] = pid;
      }
      const z0 = camera.position.z - 0.6;
      const z1 = camera.position.z + 22;
      const cx = camera.position.x;
      for (let i = 0; i < N && n < nearCap; i++) {
        if (pz[i] < z0) continue;
        if (pz[i] > z1) break;
        if (Math.abs(px[i] - cx) > 10) continue;
        if (state[i] === 2 || state[i] === 3) continue;
        const u = state[i] === 0 ? 0 : clamp((simTime - fallAt[i]) / 0.45, 0, 1);
        const ang = u * u * Math.PI * 0.5;
        dummy.position.set(px[i], 0, pz[i]);
        dummy.rotation.set(Math.sin(fallAng[i]) * ang, 0, -Math.cos(fallAng[i]) * ang);
        dummy.scale.setScalar(1);
        dummy.updateMatrix();
        pinMesh.setMatrixAt(n, dummy.matrix);
        nearIds[n++] = i;
      }
      pinMesh.count = n;
      pinMesh.instanceMatrix.needsUpdate = true;
      for (let i = 0; i < prevNear; i++) hide[prevIds[i]] = 0;
      for (let i = 0; i < n; i++) hide[nearIds[i]] = 1;
      for (let i = 0; i < n; i++) prevIds[i] = nearIds[i];
      prevNear = n;
      hideAttr.clearUpdateRanges();
      hideAttr.needsUpdate = true;
    }
    function updateGates(now) {
      for (let i = 0; i < GATES.length; i++) {
        const x = gateX(i, now);
        gateMeshes[i].group.position.x = x;
        let hot = false;
        if (phase === "place" || phase === "curve" || phase === "power") {
          for (let p = 0; p < aimPts.length; p += 3) {
            const az = aimPts[p + 2];
            if (Math.abs(az - GATES[i].z) < 0.18 && Math.abs(aimPts[p] - x) < GATES[i].w * 0.5) hot = true;
          }
        }
        const s = gateMeshes[i].base * (hot ? 1.12 : 1);
        gateMeshes[i].hoop.scale.set(s, hot ? 1.12 : 1, 1);
      }
    }
    function updateCamera(dt) {
      const follow = phase === "roll" && balive[0];
      const fx = follow ? bx[0] : ballX;
      const fz = follow ? bz[0] : START_Z;
      const wide = camera.aspect > 1;
      const targetZ = follow ? fz - (wide ? 2.75 : 2.15) : START_Z - (wide ? 2.9 : 2.05);
      const targetY = follow ? (wide ? 0.95 : 0.92) : (wide ? 0.58 : 0.7);
      const lookZ = follow ? fz + (wide ? 3.4 : 2.4) : (wide ? 1.7 : 0.85);
      const k = 1 - Math.pow(0.001, dt);
      camPos.x += (fx * 0.7 - camPos.x) * k;
      camPos.y += (targetY - camPos.y) * k;
      camPos.z += (targetZ - camPos.z) * k;
      camera.position.set(
        camPos.x + (Math.random() - 0.5) * shake,
        camPos.y + (Math.random() - 0.5) * shake * 0.45,
        camPos.z
      );
      look.x += (fx * 0.22 - look.x) * k;
      look.y = follow ? (wide ? 0.4 : 0.34) : (wide ? 0.46 : 0.3);
      look.z += (lookZ - look.z) * k;
      camera.lookAt(look);
      shake *= Math.pow(0.05, dt);
    }
    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / Math.max(1, h);
      camera.fov = h >= w ? 38 : 32;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, dprCap));
      renderer.setSize(w, h, false);
    }

    function hideTut() {
      $("tut").hidden = true;
      try { localStorage.setItem(TUT_KEY, "1"); } catch (e) {}
    }
    function onDown(e) {
      if (e.target.closest && e.target.closest("button, a, #card")) return;
      ensureAudio();
      if (phase === "place") {
        dragging = true;
        pointerId = e.pointerId;
        dragOrigin = e.clientX;
        dragBall = ballX;
        try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) {}
      } else if (phase === "curve") {
        phase = "power";
        applyHud();
      } else if (phase === "power") {
        beginRoll();
      }
    }
    function onMove(e) {
      if (!dragging || phase !== "place" || e.pointerId !== pointerId) return;
      const dx = (e.clientX - dragOrigin) / Math.max(1, window.innerWidth);
      ballX = clamp(dragBall + dx * 3.1, -1.02, 1.02);
    }
    function onUp(e) {
      if (!dragging || e.pointerId !== pointerId) return;
      dragging = false;
      if (phase === "place") {
        phase = "curve";
        applyHud();
      }
    }

    renderer.domElement.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    document.addEventListener("touchstart", (e) => {
      if (e.target.closest && e.target.closest("button, a, #card")) return;
      e.preventDefault();
    }, { passive: false });
    document.addEventListener("touchmove", (e) => {
      if (e.target.closest && e.target.closest("#card")) return;
      e.preventDefault();
    }, { passive: false });
    let lastTap = 0;
    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTap < 320 && !(e.target.closest && e.target.closest("button, a"))) e.preventDefault();
      lastTap = now;
    }, { passive: false });
    document.addEventListener("selectstart", (e) => e.preventDefault());
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    window.addEventListener("resize", resize);
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" && phase === "place") ballX = clamp(ballX - 0.08, -1.02, 1.02);
      if (e.key === "ArrowRight" && phase === "place") ballX = clamp(ballX + 0.08, -1.02, 1.02);
      if (e.key === "Escape" || e.key === "Backspace") {
        if (phase === "power") phase = "curve";
        else if (phase === "curve") phase = "place";
        applyHud();
      }
      if (e.key === "Enter" || e.key === " ") {
        ensureAudio();
        if (phase === "place") phase = "curve";
        else if (phase === "curve") phase = "power";
        else if (phase === "power") beginRoll();
        else if (phase === "result") resetGame();
        applyHud();
      }
    });
    $("lang").addEventListener("click", () => {
      lang = lang === "ja" ? "en" : "ja";
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      applyLang();
    });
    $("sound").addEventListener("click", () => {
      muted = !muted;
      $("sound").setAttribute("aria-pressed", String(!muted));
      ensureAudio();
      applyLang();
    });
    $("retry").addEventListener("click", () => resetGame());
    $("again").addEventListener("click", () => resetGame());
    $("backPhase").addEventListener("click", () => {
      if (phase === "power") phase = "curve";
      else if (phase === "curve") phase = "place";
      applyHud();
    });
    $("share").addEventListener("click", () => shareResult());
    $("post").addEventListener("click", () => {
      window.open("https://x.com/intent/post?text=" + encodeURIComponent(shareText()), "_blank", "noopener");
    });
    $("tut").addEventListener("pointerdown", (e) => { e.stopPropagation(); hideTut(); });

    let acc = 0;
    let last = performance.now();
    let slowFrames = 0;
    function frame(now) {
      const elapsed = Math.max(0, (now - last) / 1000);
      last = now;
      const realDt = Math.min(0.05, elapsed);
      sfxBudget = 0;
      if (realDt > 0.034) slowFrames++;
      else slowFrames = Math.max(0, slowFrames - 1);
      if (slowFrames > 30 && dprCap > 1) {
        dprCap = 1;
        resize();
      }
      if (phase === "curve") spinLock = (wave(now, 1.7) * 2 - 1) * 0.95;
      if (phase === "power") {
        const w = wave(now, 1.35);
        power = 0.14 + w * 0.82;
        $("knob").style.left = (w * 100) + "%";
      }
      if (phase === "roll") {
        if (slowLeft > 0) slowLeft -= realDt;
        const scale = slowLeft > 0 ? 0.34 : 1;
        acc += Math.min(realDt, 1 / 20) * scale;
        let guard = 0;
        while (acc >= STEP && guard++ < 8) { step(STEP); acc -= STEP; }
        if (!anyBall()) {
          if (!quietAt) quietAt = now;
          if (now - quietAt > 1250) finishRoll();
        } else quietAt = 0;
        if (now - rollStarted > 5200) finishRoll();
        const label = fmt(rollKnock) + t().pins;
        if ($("count").textContent !== label) $("count").textContent = label;
      } else if (phase === "mark") {
        acc += Math.min(realDt, 1 / 20);
        let guard = 0;
        while (acc >= STEP && guard++ < 6) {
          simTime += STEP;
          stepBodies(STEP);
          agePins();
          acc -= STEP;
        }
        if (now >= markUntil) afterMark();
      }
      const flo = $("floater");
      if (flo.style.opacity !== "0") {
        flo.style.opacity = String(Math.max(0, Number(flo.style.opacity) - realDt * 0.7));
      }
      if (flash > 0) {
        flash = Math.max(0, flash - realDt * 1.4);
        $("flash").style.opacity = String(flash);
      }
      if (phase !== "roll" && phase !== "mark" && phase !== "result") predict();
      else { aimPts.length = 0; aimPin = -1; }
      updateGates(now);
      drawAim();
      drawBalls();
      drawPins();
      flushInfo();
      pointMat.uniforms.uTime.value = simTime;
      updateCamera(realDt);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    resize();
    applyLang();
    camera.position.copy(camPos);
    camera.lookAt(look);
    if (!seenTut) {
      $("tut").hidden = false;
      setTimeout(hideTut, 3000);
    }
    window.__bowl = {
      ready: true,
      get phase() { return phase; },
      get knocked() { return rollKnock; },
      get score() { return totalScore; },
      get totalPins() { return N; },
      get lang() { return lang; },
      get frame() { return frameNo; },
      get roll() { return rollNo; },
      get ballX() { return ballX; },
      get power() { return power; },
      get spin() { return spinLock; },
      get stars() { return starCount(totalScore); },
      hideTut,
      reset: resetGame,
      fireAt(x, spin, pow) {
        if (phase === "roll") return false;
        ballX = clamp(x, -1.02, 1.02);
        spinLock = clamp(spin, -1, 1);
        power = clamp(pow, 0.05, 1);
        beginRoll();
        return true;
      },
      impact() { return lastImpact; },
      view() {
        const top = new THREE.Vector3(0, 0.52, 0).project(camera);
        const bot = new THREE.Vector3(0, 0, 0).project(camera);
        const ball = new THREE.Vector3(ballX, BALL_R, START_Z).project(camera);
        const h = window.innerHeight;
        return {
          pinPx: Math.abs(top.y - bot.y) * h * 0.5,
          pinY: (1 - top.y) * 0.5 * h,
          ballY: (1 - ball.y) * 0.5 * h,
          instances: pinMesh.count,
          camZ: camera.position.z,
          fov: camera.fov
        };
      }
    };
    requestAnimationFrame(frame);
  </script>
</body>
</html>
